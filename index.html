<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>몽글이의 악몽</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Jua",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
canvas{display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);z-index:1}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.go.mon{background:#4a1d6e;box-shadow:0 4px 0 #2a0e40}
button.go.sub{background:#2a2e36;box-shadow:0 4px 0 #15171c;font-size:19px;padding:12px 22px}

.btab{font-family:inherit;font-size:16px;color:#cfd3db;background:#1d2027;border:1px solid #2f343e;border-radius:10px;padding:7px 12px;cursor:pointer}
.btab.on{background:#5a1616;border-color:#a52a2a;color:#fff}
.binfo{text-align:left;max-width:300px;flex:1 1 240px}
.binfo h2{margin:0 0 2px;font-weight:400;font-size:26px}
.binfo .tag{color:#8a909c;font-size:14px;margin-bottom:10px}

.binfo td:first-child{color:#8a909c;width:64px;white-space:nowrap}
.binfo p{font-size:14px;line-height:1.55;color:#aeb4bf;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;margin:10px 0 0}
.card.wide{max-width:680px}
#red{background:radial-gradient(ellipse at center,rgba(120,0,0,0) 35%,rgba(170,0,0,.75) 100%);opacity:0;z-index:1}
#slits{display:none;z-index:1;background:repeating-linear-gradient(180deg,#050302 0 34px,rgba(0,0,0,0) 34px 46px)}

#compass{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#f3ead2 0 58%,#8a6a2a 60% 68%,#3a2a10 70%);box-shadow:0 2px 10px #000a;display:none;z-index:6;pointer-events:none}
#cNeedle{position:absolute;left:50%;top:50%;width:6px;height:56px;margin:-28px 0 0 -3px;background:linear-gradient(#c81818 0 50%,#2a2a30 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}

#hud{position:fixed;top:12px;left:12px;z-index:2;display:none;flex-direction:column;gap:7px;pointer-events:none;text-shadow:0 2px 3px #000}
.row{display:flex;align-items:center;gap:8px;font-size:18px}
.bar{width:130px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.bar>div{height:100%;width:100%;border-radius:6px}
#fuseTxt{font-size:24px;color:#ffd257}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);font-size:22px;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;display:none;z-index:2;pointer-events:none;white-space:nowrap}
#msg{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font-size:30px;text-align:center;text-shadow:0 0 12px #000,0 2px 2px #000;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:7}
.card{background:#121418;border:1px solid #2a2e36;border-radius:18px;padding:26px 24px 20px;max-width:390px;width:calc(100% - 44px);text-align:center;box-shadow:0 0 40px rgba(160,0,0,.25)}
.card h1{margin:0 0 6px;font-size:36px;font-weight:400;color:#e8e8e8;letter-spacing:1px}
.card h1 b{color:#d42a2a;font-weight:400}
.card .sub{margin:0 0 14px;color:#9aa0ab;font-size:16px;line-height:1.5}
.card ul{list-style:none;padding:0;margin:0 0 18px;text-align:left;font-size:14.5px;line-height:1.6;color:#c5cad3;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.card li{padding:2px 0 2px 26px;position:relative}
.card li i{position:absolute;left:0;font-style:normal}
.card .big{font-size:52px;margin:6px 0 0;line-height:1.1}
.card .meta{color:#9aa0ab;margin:8px 0 16px;font-size:17px}
button.go{font-family:inherit;font-size:23px;color:#fff;background:#a51d1d;border:none;border-radius:12px;padding:12px 38px;box-shadow:0 4px 0 #5e0e0e;cursor:pointer}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #5e0e0e}
.keys{font-size:12.5px;color:#6f7580;margin-top:12px;font-family:system-ui,sans-serif;line-height:1.5}
#joy{position:fixed;left:22px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none;z-index:4;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none}
.tbtn{position:fixed;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,20,25,.6);color:#fff;font-family:inherit;font-size:16px;display:none;z-index:4;touch-action:none}
#bRun{right:24px;bottom:30px;width:88px;height:88px;background:rgba(120,25,25,.7)}
#bHide{right:196px;bottom:40px}
#bLight{right:110px;bottom:40px}
#bFire{right:118px;bottom:228px;background:rgba(170,40,40,.6)}
#bMirror{right:212px;bottom:228px;background:rgba(80,130,190,.6)}
#bCrouch{right:24px;bottom:132px;left:auto}
#bFairy{right:212px;bottom:134px;background:rgba(60,160,120,.6)}
#bPotion{right:212px;bottom:40px;background:rgba(30,150,60,.65)}
#bShoot{right:128px;bottom:138px;width:86px;height:86px;background:rgba(30,90,170,.75)}
#fsBtn{position:fixed;top:12px;right:156px;z-index:8;font-size:18px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit}
#pauseBtn{position:fixed;top:12px;right:112px;z-index:8;font-size:18px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;cursor:pointer;font-family:inherit;display:none}
.sens{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0 4px;color:#c5cad3;font-size:16px}
.sens input{width:170px;accent-color:#a52a2a}
#musBtn{position:fixed;top:12px;right:12px;z-index:4;font-size:20px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px;cursor:pointer;display:none}
#stunTxt{color:#7fc4ff;display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 4px #000;z-index:2;pointer-events:none;display:none}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
#bestWrap{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;justify-content:center}
#bestView{width:300px;height:340px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#2a1410 0%,#0b0708 70%);border:1px solid #2a2e36;flex:none}
#bestView canvas{display:block}
@keyframes hearRing{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}@keyframes hearShake{0%{transform:translate(-2px,1px)}100%{transform:translate(2px,-1px)}}
</style>
</head>
<body>
<div class="fx" id="vig"></div>
<div class="fx" id="red"></div>
<div class="fx" id="slits"></div>
<div class="fx" id="flash"></div>
<div id="camFlash" style="position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(circle,#fff 0 35%,rgba(235,245,255,.85) 70%,rgba(220,235,255,.6))"></div>
<div id="curseBox" style="display:none;position:fixed;top:118px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;font-size:15px;color:#ffd0c0;text-shadow:0 1px 3px #000">
<div id="curseTxt">🔔 종의 저주</div><div style="width:260px;height:12px;margin-top:4px;border-radius:7px;background:rgba(0,0,0,.6);border:1px solid #7a2020;overflow:hidden"><div id="curseBar" style="height:100%;width:0%;background:linear-gradient(90deg,#8a1010,#ff3a2a)"></div></div></div>
<div id="hearFx" style="position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden"></div><div id="staticFx" style="position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;mix-blend-mode:screen"></div>
<div id="slimeFx" style="position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity 1s;box-shadow:inset 0 0 180px 50px rgba(40,140,30,.55)"></div><div id="slimeSplat" style="position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden"></div>
<div id="curseFx" style="position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 220px 80px rgba(20,0,0,.85)"></div>
<div id="potionFx" style="position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 160px 40px rgba(20,190,60,.4)"></div>
<div id="compass"><div id="cNeedle"></div><div id="cTxt"></div></div>
<div id="hud">
  <div class="row" id="fuseTxt">⚡ 퓨즈 0 / 5</div>
  <div class="row">❤️ <div class="bar"><div id="hpBar" style="background:#ff4a5a"></div></div> <span id="hpTxt" style="font-size:15px;min-width:34px">100</span></div>
  <div class="row">🏃 <div class="bar"><div id="staBar" style="background:#7fd0ff"></div></div></div>
  <div class="row" id="keyTxt">🔑 열쇠 0</div>
  <div class="row" id="itemTxt"></div>
  <div class="row" id="stunTxt"></div>
</div>
<div id="prompt"></div>
<div id="msg"></div>
<div id="joy"><div id="knob"></div></div>
<button class="tbtn" id="bRun">달리기</button>
<button class="tbtn" id="bHide">행동</button>
<button class="tbtn" id="bLight">🔥</button>
<button class="tbtn" id="bShoot">📸</button>

<button class="tbtn" id="bFire">🎆</button>
<button class="tbtn" id="bMirror">🪞</button>
<button class="tbtn" id="bFairy">🧚</button><button class="tbtn" id="bPotion">🧪</button><button class="tbtn" id="bOrb">🔮</button>
<button class="tbtn" id="bCrouch">앉기</button>
<button id="musBtn">🎵</button>
<button id="pauseBtn">⏸</button>
<button id="ghostExit" style="display:none;position:fixed;top:12px;left:12px;z-index:8;font-family:inherit;font-size:17px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;cursor:pointer">← 메뉴로</button>
<button id="fsBtn" title="전체화면">⛶ 전체화면</button>
<div id="cross"></div>
<div id="overlay"></div>
<div id="err">3D 그래픽을 불러오지 못했어요. 새로고침하거나 다른 브라우저로 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const $=id=>document.getElementById(id);
const PI=Math.PI,V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ================= 설정 =================
const N0=15,G0=2*N0+1,OFF=G0+1,G=2*OFF+G0,N=(G-1)/2,T=3,H=4.6; // 1층: x 0..G0-1, 2층: x OFF..G-1 (z는 0..G0-1)
const PR=0.45,WALK=4.6,RUN=7.6;
const NEED=5,LEVER_NEED=2,OPENROOMS=20,SMALLROOMS=27;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// ================= 렌더러 =================
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){$('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030405);
scene.fog=new THREE.FogExp2(0x040504,0.035);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,52);
scene.add(camera);
const handLight=new THREE.Group();camera.add(handLight);
const lensMat=new THREE.MeshBasicMaterial({color:0xffb347});
const flame=new THREE.Group();
const flameGlow=new THREE.Sprite(new THREE.SpriteMaterial({color:0xff9a30,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));
(function(){const metal=new THREE.MeshBasicMaterial({color:0x8a8f98}),red=new THREE.MeshBasicMaterial({color:0x8a1d1d});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.03),red);handLight.add(body);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.052,.03,.032),metal);cap.position.y=.065;handLight.add(cap);
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.02,10),metal);wheel.rotation.z=PI/2;wheel.position.set(0,.085,.008);handLight.add(wheel);
  const core=new THREE.Mesh(new THREE.ConeGeometry(.013,.05,8),new THREE.MeshBasicMaterial({color:0xfff2b0}));core.position.y=.025;flame.add(core);
  const outer=new THREE.Mesh(new THREE.ConeGeometry(.022,.075,8),new THREE.MeshBasicMaterial({color:0xff8a20,transparent:true,opacity:.8}));outer.position.y=.035;flame.add(outer);
  flameGlow.scale.set(.22,.22,1);flameGlow.position.y=.03;flame.add(flameGlow);
  flame.position.y=.1;handLight.add(flame);
  const hand=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.1),new THREE.MeshBasicMaterial({color:0x6b4a3a}));hand.position.set(0,-.05,.03);handLight.add(hand);
  handLight.rotation.set(0,-.15,0);handLight.visible=false;})();

// 2층은 논리상 옆에 붙어 있지만, 화면에는 1층 바로 위(높이 H)에 쌓아서 그림
const SPLIT=OFF*T-1,F2=new THREE.Group();F2.position.set(-OFF*T,H+.04,0);scene.add(F2);let world2=null;
// 지하층: 논리상 x 2*OFF.. 에 붙어 있고, 화면에는 1층 바로 아래(높이 -H)에 그림
const SPLIT3=2*OFF*T-1,F3=new THREE.Group();F3.position.set(-2*OFF*T,-(H+.04),0);scene.add(F3);let world3=null;
const FLOFF=[0,OFF*T,2*OFF*T],FLY=[0,H+.04,-(H+.04)],FLN=['1층','2층','지하'];
function flX(x){return x>=SPLIT3?2:x>=SPLIT?1:0;}
function flI(i){return i>=2*OFF?2:i>=OFF?1:0;}
const ambLight=new THREE.AmbientLight(0x2a3550,0.32);scene.add(ambLight);
const hemiLight=new THREE.HemisphereLight(0x223047,0x0a0806,0.25);scene.add(hemiLight);

const flashlight=new THREE.SpotLight(0xff9a40,1.7,15,1.2,1,1.5);
flashlight.castShadow=true;flashlight.shadow.mapSize.set(1024,1024);flashlight.shadow.camera.near=0.3;flashlight.shadow.bias=-0.0006;
scene.add(flashlight);scene.add(flashlight.target);
const aura=new THREE.PointLight(0xff8a30,0.9,9,1.6);scene.add(aura);

// ================= 텍스처 =================
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);}return t;}
const floorTex=canvasTex(256,256,(g,w,h)=>{
  // 오래된 집 마룻바닥: 짙은 적갈색 넓은 판자, 닳은 자국
  for(let c=0;c<6;c++){const x=c*43;g.fillStyle=`hsl(${18+Math.random()*8},${32+Math.random()*12}%,${15+Math.random()*7}%)`;g.fillRect(x,0,43,h);
    g.fillStyle='rgba(0,0,0,.6)';g.fillRect(x,0,2,h);const off=Math.random()*256;g.fillRect(x,off,43,2);
    for(let k=0;k<22;k++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,200,150'},${Math.random()*.07})`;g.fillRect(x+3+Math.random()*38,0,1,h);}}
  for(let i=0;i<40;i++){g.strokeStyle=`rgba(255,210,170,${Math.random()*.07})`;g.beginPath();const x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);g.lineTo(x+rand(-20,20),y+rand(-6,6));g.stroke();}
  for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.25})`;g.fillRect(Math.random()*w,Math.random()*h,1,2+Math.random()*5);}
  const gr=g.createRadialGradient(128,128,20,128,128,180);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.3)');g.fillStyle=gr;g.fillRect(0,0,w,h);
},(G*T)/4);
const wallTex=canvasTex(256,256,(g,w,h)=>{
  // 오래된 일본식 집 벽: 얼룩진 붉은 흙벽(위) + 짙은 나무 판자(아래), 나무 기둥과 가로 들보
  const koshiY=h*.74,nageY=h*.13;
  g.fillStyle='#7a4a2a';g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const v=Math.random();g.fillStyle=`rgba(${v<.5?150:60},${v<.5?88:34},${v<.5?44:14},${rand(.08,.22)})`;g.beginPath();g.ellipse(Math.random()*w,Math.random()*koshiY,rand(8,40),rand(6,34),Math.random()*3,0,7);g.fill();}
  for(let i=0;i<3000;i++){g.fillStyle=Math.random()<.5?`rgba(30,14,4,${Math.random()*.16})`:`rgba(220,160,100,${Math.random()*.08})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
  // 흘러내린 물 얼룩
  for(let i=0;i<5;i++){const x=Math.random()*w,gr=g.createLinearGradient(0,nageY,0,koshiY);gr.addColorStop(0,'rgba(25,10,2,.35)');gr.addColorStop(1,'rgba(25,10,2,0)');g.fillStyle=gr;g.fillRect(x,nageY,rand(4,16),koshiY-nageY);}
  // 갈라진 금
  g.strokeStyle='rgba(20,8,2,.45)';g.lineWidth=1;for(let i=0;i<5;i++){g.beginPath();let x=Math.random()*w,y=rand(nageY,koshiY);g.moveTo(x,y);for(let k=0;k<6;k++){x+=rand(-10,10);y+=rand(2,12);g.lineTo(x,y);}g.stroke();}
  // 위쪽 가로 들보(나게시)
  g.fillStyle='#2a170a';g.fillRect(0,nageY-8,w,14);g.fillStyle='rgba(255,200,140,.08)';g.fillRect(0,nageY-8,w,2);g.fillStyle='#1a0e06';g.fillRect(0,0,w,6);
  // 아래 판자벽
  g.fillStyle='#2e1c0e';g.fillRect(0,koshiY,w,h-koshiY);
  for(let x=0;x<w;x+=22){g.fillStyle=`rgba(${70+Math.random()*30},${42+Math.random()*16},${20+Math.random()*10},.55)`;g.fillRect(x+1,koshiY+3,20,h-koshiY-8);g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,koshiY,2,h-koshiY);}
  g.fillStyle='#1c1007';g.fillRect(0,koshiY-6,w,8);g.fillStyle='rgba(255,200,140,.07)';g.fillRect(0,koshiY-6,w,1.5);

function bfsDist(si,sj){const d=new Int32Array(G*G).fill(-1);const q=[si*G+sj];d[si*G+sj]=0;let h=0;

// 막다른 길 없애기: 복도 끝이 막혀 있으면 옆 복도로 벽을 뚫어 이어 줌
function braidMaze(){
  const D=[[1,0],[-1,0],[0,1],[0,-1]];
  const isCell=(i,j)=>{const fl=flI(i),lo=fl*OFF+1,hi=fl*OFF+G0-2;return i>=lo&&i<=hi&&j>=1&&j<=G0-2;};
  const corr=(i,j)=>isCell(i,j)&&grid[i][j]===0&&!vaultTiles.has(i*G+j);
  const openCount=(i,j)=>D.reduce((n,[a,b])=>n+(grid[i+a][j+b]!==1?1:0),0);
  for(let pass=0;pass<2;pass++){
    const cells=[];for(let i=1;i<G-1;i+=2)for(let j=1;j<G0-1;j+=2)if(corr(i,j))cells.push([i,j]);
    for(const [i,j] of shuffle(cells)){
      if(openCount(i,j)!==1)continue;
      const opts=[];
      for(const [a,b] of D){const wi=i+a,wj=j+b,ni=i+2*a,nj=j+2*b;
        if(grid[wi][wj]!==1||noOpen.has(wi*G+wj)||vaultTiles.has(wi*G+wj)||!corr(ni,nj))continue;
        opts.push({wi,wj,dead:openCount(ni,nj)===1});}

function addBackDoors(){

    const dx=B.i-A.i,dz=B.j-A.j;if(!((dx===4&&dz===0)||(dx===0&&dz===4)))continue;

let musVol=1,sfxVol=1;try{const a=localStorage.getItem('mongle_mus'),b=localStorage.getItem('mongle_sfx');if(a!==null)musVol=clamp(parseFloat(a),0,1)||0;if(b!==null)sfxVol=clamp(parseFloat(b),0,1)||0;}catch(e){}
const BEAT=60/66/2;
const CH=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initMusic(){
  if(!AC||musBus)return;
  musBus=AC.createGain();musBus.gain.value=.55;
  const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=BEAT*3;fb.gain.value=.38;wet.gain.value=.45;
  musOut=AC.createGain();musOut.gain.value=musVol;musOut.connect(AC.destination);
  musBus.connect(musOut);musBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(musOut);
}
function mnote(f,t,d,type,v,lp){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.6,d*.25));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(lp){const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lp;o.connect(f2);f2.connect(g);}else o.connect(g);
  g.connect(musBus);o.start(t);o.stop(t+d+.05);}catch(e){}}
function pluck(f,t,v){try{const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.01;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);const g2=AC.createGain();g2.gain.value=.25;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(musBus);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);}catch(e){}}
function scheduleMusic(){
  if(!AC||!musBus||!musicOn||(state!=='play'))return;
  const now=AC.currentTime;if(musNext<now)musNext=now+.05;
  const chase=M.state==='chase'||M.state==='closet';
  while(musNext<now+.25){
    const t=musNext,bar=Math.floor(musStep/8)%4,pos=musStep%8,ch=CH[bar];
    if(pos===0){ch.forEach(n=>mnote(mtof(n-12),t,BEAT*8.5,'triangle',.05,700));mnote(mtof(ch[0]-24),t,BEAT*8.5,'sine',.08);}
    const pat=[0,2,1,2,0,3,1,2];
    if(Math.random()<(chase?.95:.8)){const p=pat[pos],n=p===3?ch[0]+24:ch[p]+12;pluck(mtof(n+(Math.random()<.06?1:0)),t,.07);}
    if(chase){if(pos%2===0){mnote(55,t,.25,'sine',.22);noise(.06,.05,180,1,t-now);}if(pos===4)mnote(mtof(ch[0]+1),t,BEAT*3,'sawtooth',.03,1200);}
    musNext+=chase?BEAT*.75:BEAT;musStep++;
  }
}
function toggleMusic(){musicOn=!musicOn;if(musBus)musBus.gain.setTargetAtTime(musicOn?.55:0,AC.currentTime,.1);$('musBtn').textContent=musicOn?'🎵':'🔇';msg(musicOn?'🎵 음악 켬':'🔇 음악 끔',1);}
const sfx={
  bark:(v,hi)=>{if(!AC)return;const n=hi?3:2,gap=hi?.22:.3;
    for(let k=0;k<n;k++){try{const t=AC.currentTime+k*gap+Math.random()*.03,f0=(hi?300:260)*(1+Math.random()*.08);
      const o=AC.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f0*.8,t);o.frequency.exponentialRampToValueAtTime(f0*1.7,t+.035);o.frequency.exponentialRampToValueAtTime(f0*.75,t+.2);
      const o2=AC.createOscillator();o2.type='square';o2.frequency.setValueAtTime(f0*.4,t);o2.frequency.exponentialRampToValueAtTime(f0*.85,t+.035);o2.frequency.exponentialRampToValueAtTime(f0*.38,t+.2);
      const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.setValueAtTime(900,t);bp.frequency.exponentialRampToValueAtTime(1400,t+.04);bp.frequency.exponentialRampToValueAtTime(700,t+.2);bp.Q.value=1.3;
      const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
      const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v*1.4),t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.24);
      const g2=AC.createGain();g2.gain.value=.35;
      o.connect(bp);o2.connect(g2);g2.connect(bp);bp.connect(lp);lp.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+.26);o2.stop(t+.26);}catch(e){}
      noise(.09,v*.5,1600,1.2,k*gap);}
  },
  growl:(v,hi)=>{const p=hi?1.35:1;noise(1.1,v*.45,150*p,2.5);osc(52*p,1.2,'sawtooth',v*.22,18);osc(78*p,1.0,'triangle',v*.3,-28);noise(.6,v*.18,420*p,4,.25);},
  giggle:(v,ch)=>{const b=ch?1.15:1;[[1180,0],[1050,.13],[940,.26],[1250,.42]].forEach(([f,t])=>{osc(f*b,.12,'sine',v*.5,-120,t);osc(f*b*2,.1,'sine',v*.12,-200,t);noise(.08,v*.12,2600,3,t);});},
  sob:v=>{[0,.32,.6,1.05].forEach((t,k)=>{const f=560-k*25+rand(-15,15);osc(f,.26,'sine',v*.55,-90,t);osc(f*1.5,.2,'sine',v*.15,-120,t);noise(.22,v*.35,1300,3,t);});},
  stomp:(v,ch)=>{osc(ch?52:46,.22,'sine',v,-22);noise(.14,v*.7,160,1);noise(.05,v*.25,900,1.5,.01);osc(30,.3,'sine',v*.6,-8,.02);},
  toll:v=>{if(!AC)return;[[110,1],[220,.5],[264,.35],[330,.25],[440,.18],[587,.1]].forEach(([f,a])=>{osc(f,3.2,'sine',v*a,0);osc(f*1.003,3.2,'sine',v*a*.5,0);});noise(.08,v*.3,1800,1.5);},
  croak:v=>{const n=3+Math.floor(Math.random()*3);for(let k=0;k<n;k++){const d=k*.075+Math.random()*.015;noise(.055,v*(.9-k*.08),330+Math.random()*140,3.5,d);osc(78+Math.random()*14,.05,'sawtooth',v*.35,-25,d);noise(.03,v*.3,1200,2,d+.01);}},
  hum:v=>{const base=rand(0,1)<.5?[69,67,64,62]:[64,67,69,64];base.forEach((m,k)=>{const f=mtof(m)*(1+rand(-.006,.006));osc(f,.5,'sine',v*.5,-4,k*.42);osc(f*2,.4,'sine',v*.08,0,k*.42);});noise(1.6,v*.18,700,.8,.1);},
  dollCry:v=>{const f=rand(620,720);osc(f,.55,'sawtooth',v*.12,260);osc(f*1.01,.55,'sine',v*.35,250);osc(f*1.5,.4,'sine',v*.1,200,.05);osc(f+240,.35,'sine',v*.25,-380,.5);noise(.5,v*.12,2200,3);},
  wail:v=>{osc(760,1.3,'sawtooth',v*.22,-380);osc(780,1.3,'sine',v*.35,-400);noise(1.1,v*.3,1500,2);},
  bell:v=>{const p=1+rand(-.02,.02);[[2350,.7],[3520,.35],[5170,.18]].forEach(([f,a])=>osc(f*p,.9,'sine',v*a));osc(2350*p*1.01,.6,'sine',v*.3,0,.09);osc(3520*p,.5,'sine',v*.15,0,.09);},
  heart:v=>{osc(58,.14,'sine',v);osc(48,.18,'sine',v*.8,0,.17);},
  mstep:v=>{osc(62,.22,'sine',v,-20);noise(.09,v*.5,260,1);},
  pstep:()=>noise(.05,.035,700,1),
  // 달리는 발소리: 나무 바닥 — 속이 빈 듯한 '통' 울림 + 판자 딱 소리, 가끔 삐걱
  prun:(side)=>{const f=side?150:175;osc(f,.12,'triangle',.2,-45);osc(f*2.3,.06,'sine',.07,-60);noise(.1,.18,side?420:480,3.5);noise(.03,.08,2600,4,.005);
    if(Math.random()<.14){osc(side?310:340,.18,'sawtooth',.025,-40,.03);noise(.16,.025,900,8,.03);}},
  screech:()=>{noise(1.0,.35,1700,2);osc(900,1.0,'sawtooth',.1,-520);osc(955,1.0,'square',.05,-580);},
  scare:()=>{noise(1.5,.9,1100,.6);osc(1500,1.3,'sawtooth',.35,-1300);osc(95,1.3,'square',.3,-50);noise(1.2,.5,300,.8,.05);},
  pick:()=>{osc(660,.18,'sine',.14);osc(990,.3,'sine',.12,0,.1);},
  gate:()=>{osc(48,2.2,'sawtooth',.16,25);noise(1.8,.25,180,1);osc(330,.6,'triangle',.1,0,.3);osc(495,.9,'triangle',.1,0,.6);},
  creak:()=>{osc(320,.4,'triangle',.06,-140);noise(.35,.1,950,5);},
  click:()=>{noise(.06,.12,3500,2);osc(2400,.02,'square',.03);},
  whisper:()=>{noise(1.6,.06,2400,6);noise(1.4,.05,3100,8,.3);},
  win:()=>{[523,659,784,1046].forEach((f,k)=>osc(f,.5,'triangle',.12,0,k*.13));}
};

function pushAABB(p,r,x0,z0,x1,z1){
  const cx=clamp(p.x,x0,x1),cz=clamp(p.z,z0,z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return;
  if(d2>1e-9){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
  else{const a=p.x-x0,b=x1-p.x,c=p.z-z0,e=z1-p.z,m=Math.min(a,b,c,e);if(m===a)p.x=x0-r;else if(m===b)p.x=x1+r;else if(m===c)p.z=z0-r;else p.z=z1+r;}
}
function collide(p,r){
  const ci=tileOf(p.x),cj=tileOf(p.z);
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){
    const dr=(i>=0&&j>=0&&i<G&&j<G&&(grid[i][j]===3||grid[i][j]===4))?(grid[i][j]===3?doorMap.get(i*G+j):winMap.get(i*G+j)):null;
    if(dr){const c0=tc(dr.i)-dr.ox*(T/2-.225),c1=tc(dr.j)-dr.oz*(T/2-.225),ha=.225,hl=T/2;
      const hx=dr.ox!==0?ha:hl,hz=dr.ox!==0?hl:ha;pushAABB(p,r,c0-hx,c1-hz,c0+hx,c1+hz);continue;}
    if(solid(i,j))pushAABB(p,r,i*T,j*T,i*T+T,j*T+T);}
  for(const c of closets)pushAABB(p,r,c.minX,c.minZ,c.maxX,c.maxZ);
  for(const c of furnBoxes)pushAABB(p,r,c.minX,c.minZ,c.maxX,c.maxZ);
}

  const cl=nearCloset();if(cl){const d=Math.hypot(P.pos.x-(cl.x+cl.fx*cl.S.out),P.pos.z-(cl.z+cl.fz*cl.S.out));if(d<bd){bd=d;best={type:'hide',c:cl};}}

  for(const l of levers){if(l.down||(leversDown>=LEVER_NEED&&!slimeN()))continue;const d=Math.hypot(P.pos.x-(l.x+l.fx*.8),P.pos.z-(l.z+l.fz*.8));if(d<1.6&&d<bd){bd=d;best={type:'lever',c:l};}}
  for(const dr of doors){if(dr.broken)continue;
    if(!dr.open){const ix=tc(dr.i)-dr.ox*(T/2+.9),iz=tc(dr.j)-dr.oz*(T/2+.9);const d=Math.min(Math.hypot(P.pos.x-dr.fx,P.pos.z-dr.fz),Math.hypot(P.pos.x-ix,P.pos.z-iz));if(d<2.0&&d<bd){bd=d;best={type:'door',c:dr};}}

function buildBestWorm(g,m){
  const hole=new THREE.Mesh(new THREE.CircleGeometry(.4,16),wormHoleMat);hole.rotation.x=-PI/2;hole.position.y=.01;g.add(hole);
  let parent=g;const segs=[];
  for(let k=0;k<7;k++){const sg=new THREE.Group();sg.position.y=k?.12:0;sg.rotation.z=k?.12:0;sg.rotation.x=k?.06:0;parent.add(sg);
    const r=.11-k*.008,b=new THREE.Mesh(new THREE.CylinderGeometry(r-.008,r,.12,12),k%2?wormMat2:wormMat);b.position.y=.06;sg.add(b);segs.push(sg);parent=sg;}
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.08,12,10),wormMat);hd.position.y=.13;hd.scale.set(1,.7,1);parent.add(hd);
  m.segs=segs;m.head=hd;
}
function buildBestFly(g,m){
  const f=new THREE.Group();f.scale.setScalar(2.6);f.position.y=1.0;g.add(f);
  const body=new THREE.Mesh(new THREE.SphereGeometry(.07,12,10),flyBodyMat);body.scale.set(1,.8,1.9);f.add(body);
  const tail=new THREE.Mesh(new THREE.ConeGeometry(.045,.14,8),flyBodyMat);tail.rotation.x=-PI/2;tail.position.z=-.17;f.add(tail);
  [-1,1].forEach(s2=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.022,8,6),flyEyeMat);e.position.set(s2*.04,.02,.12);f.add(e);});
  for(let k=0;k<3;k++)[-1,1].forEach(s2=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.008,.08,.008),flyBodyMat);l.position.set(s2*.05,-.06,.05-k*.05);l.rotation.z=s2*.5;f.add(l);});
  m.wings=[-1,1].map(s2=>{const piv=new THREE.Group();piv.position.set(s2*.03,.05,0);const w=new THREE.Mesh(new THREE.PlaneGeometry(.2,.09),flyWingMat);w.rotation.x=-PI/2;w.position.x=s2*.1;piv.add(w);f.add(piv);return {piv,s:s2};});
  m.head=f;
}
let bestR=null,bestScene=null,bestCam=null,bestModels=[],bestIdx=0,bestOpen=false;
function initBest(){

  bestR.setPixelRatio(Math.min(window.devicePixelRatio||1,2));bestR.setSize(300,340);
  bestScene=new THREE.Scene();bestCam=new THREE.PerspectiveCamera(40,300/340,.05,50);
  bestScene.add(new THREE.AmbientLight(0x6a5a60,.9));
  const key=new THREE.DirectionalLight(0xffc89a,1.0);key.position.set(2,4,5);bestScene.add(key);
  const rim=new THREE.DirectionalLight(0xff3020,.8);rim.position.set(-3,3,-4);bestScene.add(rim);
  const fl=new THREE.Mesh(new THREE.CircleGeometry(1.6,32),new THREE.MeshPhongMaterial({color:0x1a1210}));fl.rotation.x=-PI/2;bestScene.add(fl);
  BEST.forEach(b=>{const st=MON_STYLES.find(x=>x.kind===b.kind);const g=new THREE.Group();const m={};(b.build||BUILDERS[b.kind])(g,m,st);g.visible=false;bestScene.add(g);bestModels.push({g,m});});

let bestT=0;
function renderBest(dt){
  if(!bestOpen||!bestR||overlay.style.display==='none'||!document.getElementById('bestView'))return;
  bestT+=dt;const x=bestModels[bestIdx];if(!x)return;
  x.g.rotation.y=bestT*.6;
  const sw=Math.sin(bestT*2)*.12;if(x.m.armL){x.m.armL.rotation.x=-sw;x.m.armR.rotation.x=sw;}
  if(x.m.segs)x.m.segs.forEach((sg,k)=>{if(k)sg.rotation.z=.12+Math.sin(bestT*2.2+k*.7)*.12;});
  if(x.m.wings)x.m.wings.forEach(w=>{w.piv.rotation.z=w.s*Math.sin(bestT*60)*.8;});
  if(x.m.tails)x.m.tails.forEach((t,k)=>{t.rotation.z=Math.sin(bestT*1.5+k*PI)*.15*(k?1:-1);});
  if(x.m.bell)x.m.bell.rotation.z=Math.sin(bestT*6)*.3;
  if(x.m.head&&!x.m.wings)x.m.head.rotation.z=Math.sin(bestT*.7)*.08;
  bestR.render(bestScene,bestCam);
}

  // 2층 천장과 들보만 걷어서 하늘에서 내려다볼 수 있게
  const ce=world.userData.ceils||[];if(ce[1])ce[1].visible=false;(world.userData.beams||[]).forEach(b=>{if(b.parent===world2)b.visible=false;});
  if(world1){world1.visible=world2s.visible=world3s.visible=true;}
  ambLight.color.setHex(0x9aa4b8);ambLight.intensity=1.0;hemiLight.intensity=.6;camera.far=400;camera.updateProjectionMatrix();
  $('hud').style.display='none';$('ghostExit').style.display='block';$('pauseBtn').style.display='none';$('red').style.opacity=0;
  $('bLight').textContent='위';$('bHide').textContent='아래';$('bRun').textContent='빠르게';
  msg('👻 유령 모드 — 벽을 뚫고 날아다녀요<br><span style="font-size:18px">'+(isTouch?'조이스틱 이동 · 위/아래 버튼':'WASD 이동 · Space 위 · C 아래 · Shift 빠르게 · T 하늘에서 보기 · Esc 메뉴')+'</span>',5);
}
function exitGhost(){if(mode!=='ghost')return;state='menu';mode='survivor';$('ghostExit').style.display='none';$('hud').style.display='';
  (world.userData.ceils||[]).forEach(c=>c.visible=true);(world.userData.beams||[]).forEach(b=>b.visible=true);cullKey='';P.pos.copy(startPos);
  ambLight.color.setHex(0x2a3550);ambLight.intensity=.32;hemiLight.intensity=.25;camera.far=52;camera.updateProjectionMatrix();
  $('bLight').textContent='🔥';$('bHide').textContent='행동';$('bRun').textContent='달리기';
  try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}showMenu();}
$('ghostExit').addEventListener('click',e=>{e.stopPropagation();exitGhost();});
addEventListener('keydown',e=>{if(mode==='ghost'&&state==='play'){if(e.code==='Escape')exitGhost();
  if(e.code==='KeyT'&&!e.repeat){GH.pos.set(OFF*T+G0*T/2,150,G0*T/2+.01);GH.vel.set(0,0,0);pitch=1.55;msg('하늘에서 내려다보기',1.2);}}});
$('bLight').addEventListener('pointerdown',()=>{if(mode==='ghost')ghostUp=true;});
$('bHide').addEventListener('pointerdown',()=>{if(mode==='ghost')ghostDown=true;});
['pointerup','pointercancel','pointerleave'].forEach(ev=>{$('bLight').addEventListener(ev,()=>{ghostUp=false;});$('bHide').addEventListener(ev,()=>{ghostDown=false;});});
function updateGhost(dt){
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy;
  let str=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
  const up=(keys.Space||ghostUp?1:0)-(keys.KeyC||keys.ControlLeft||ghostDown?1:0);
  const sp=(keys.ShiftLeft||keys.ShiftRight||runBtn)?28:10;
  const cp=Math.cos(pitch),fx=-Math.sin(yaw)*cp,fy=-Math.sin(pitch),fz=-Math.cos(yaw)*cp,rx=Math.cos(yaw),rz=-Math.sin(yaw);
  const tx=(fx*fwd+rx*str)*sp,ty=(fy*fwd+up)*sp,tz=(fz*fwd+rz*str)*sp,k=Math.min(1,dt*6);
  GH.vel.x+=(tx-GH.vel.x)*k;GH.vel.y+=(ty-GH.vel.y)*k;GH.vel.z+=(tz-GH.vel.z)*k;
  GH.pos.addScaledVector(GH.vel,dt);
  // 층 넘나들기: 지하 ↔ 1층 ↔ 2층 (2층 위로는 하늘까지)
  const L=H+.04;let f=flX(GH.pos.x);
  if(f===0&&GH.pos.y>L){GH.pos.x+=OFF*T;GH.pos.y-=L;f=1;}
  else if(f===0&&GH.pos.y<0){GH.pos.x+=2*OFF*T;GH.pos.y+=L;f=2;}
  else if(f===1&&GH.pos.y<0){GH.pos.x-=OFF*T;GH.pos.y+=L;f=0;}
  else if(f===2&&GH.pos.y>L){GH.pos.x-=2*OFF*T;GH.pos.y-=L;f=0;}
  const x0=FLOFF[f]-30,x1=FLOFF[f]+G0*T+30;GH.pos.x=clamp(GH.pos.x,x0,x1);GH.pos.z=clamp(GH.pos.z,-30,G0*T+30);
  GH.pos.y=clamp(GH.pos.y,f===2?.3:-1,f===1?160:L+1);
}
// ================= 메인 루프 =================
const clock=new THREE.Clock(),tmp=new V3(),camDir=new V3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  let mDist=99;
  if(state==='play'&&(mode==='survivor'||mode==='ghost')){
    const lp=listenerPos();
    for(const x of activeMons()){
      if(x.M.state==='sleep'||x.M.state==='off'||x.M.state==='stun')continue;
      const d=Math.hypot(x.M.pos.x-lp.x,x.M.pos.z-lp.z),ch=x.M.state==='chase'||x.M.state==='closet';
      x.sndT=(x.sndT===undefined?rand(0,2):x.sndT)-dt;
      if(x.sndT>0)continue;
      const k=x.mo.kind;
      if(k==='spider'){x.sndT=99;continue;} // 소녀거미는 소리를 내지 않음
      if(k==='stomper'){x.sndT=ch?.3:.55;const v=clamp(1-d/42,0,1);if(v>0)sfx.stomp(.05+v*v*.6,ch);if(d<14&&ch)shake=Math.max(shake,.04);continue;}
      if(k==='stalker'){x.sndT=2.5;const v=clamp(1-d/34,0,1);if(v>0)sfx.hum(.03+v*v*.32);continue;}
      if(k==='weeper'){const v=clamp(1-d/(x.M.state==='weep'?34:x.M.state==='creep'?30:26),0,1);if(x.M.state==='creep'){x.sndT=rand(.9,1.4);if(v>0)sfx.croak(.06+v*v*.45);continue;}if(x.M.state==='weep'){x.sndT=x.M.wakeT>0?99:rand(2.2,2.8);if(v>0&&x.M.wakeT<=0)sfx.sob(.04+v*v*.4);}else{x.sndT=ch?1.4:2.5;if(v>0)sfx.wail(.02+v*v*.22);}continue;}
      if(k==='bell'){x.sndT=ch?rand(.28,.4):rand(.8,1.5);const v=clamp(1-d/30,0,1);if(v>0)sfx.bell(.02+v*v*.16);x.mo.bell.rotation.z=.6;}
      else if(k==='twin'){x.sndT=2.5;const v=clamp(1-d/32,0,1);if(v>0)sfx.giggle(.03+v*v*.3,ch);}
      else{x.sndT=2.5;const v=clamp(1-d/36,0,1);if(v>0)sfx.bark(.05+v*v*.45,ch);}
    }
    for(const x of activeMons())if(x.mo.bell)x.mo.bell.rotation.z*=Math.pow(.02,dt);
  }
  if(state==='play'&&mode==='ghost'){
    playT+=dt;updateGhost(dt);updateFireworks(dt);for(const x of activeMons()){useMon(x);updateMonster(dt);}useMon(monsters[0]);prompt.style.display='none';
  }else if(state==='play'){
    playT+=dt;
    updatePlayer(dt);
    updateFireworks(dt);updateFireFly(dt);updateDolls(dt);updateWorms(dt);updateFlies(dt);
    {let near=monsters[0];mDist=99;for(const x of activeMons()){useMon(x);const d=freezeT>0?Math.hypot(M.pos.x-P.pos.x,M.pos.z-P.pos.z):updateMonster(dt);if(state!=='play')break;if(d<mDist){mDist=d;near=x;}}useMon(near);}
    // 심장 박동
    const chase=M.state==='chase'||M.state==='closet';
    const close=clamp(1-mDist/(chase?30:20),0,1)*(M.state==='sleep'?.3:1);
    heartT-=dt;if(heartT<=0&&close>.05){heartT=1.15-close*.8;sfx.heart(.05+close*.32);}
    $('red').style.opacity=chase?(.25+close*.6).toFixed(2):(close*.35).toFixed(2);
    whisperT-=dt;if(whisperT<=0){whisperT=rand(14,30);if(Math.random()<.6)sfx.whisper();}
    // 안내
    const it=!hidden&&interactTarget();const c=it&&it.type==='hide'?it.c:null;
    const key=isTouch?'행동 버튼':'E';
    if(hidden){prompt.textContent=(isTouch?'행동 버튼':'E')+' — '+hidden.S.name+'에서 나가기';prompt.style.display='block';}
    else if(c){prompt.textContent=key+' — '+c.S.name+'에 숨기';prompt.style.display='block';}
    else if(it&&it.type==='candle'){prompt.textContent=key+' — 🕯️ 촛불 켜기';prompt.style.display='block';}
    else if(it&&it.type==='drawer'){prompt.textContent=key+(it.c.shelf?' — 집기':' — 서랍 열기');prompt.style.display='block';}
    else if(it&&it.type==='lever'){prompt.textContent=key+' — 🎚️ 레버 내리기';prompt.style.display='block';}
    else if(it&&it.type==='doorClose'){prompt.textContent=key+' — 문 닫기';prompt.style.display='block';}
    else if(it&&it.type==='door'){prompt.textContent=!it.c.vault?key+' — 문 열기':keyCount>0?key+' — 🔑 열쇠로 문 열기':'🔒 잠긴 방 (열쇠 필요)';prompt.style.display='block';}
    else prompt.style.display='none';
    updateHUD();
  }else if(state==='caught'){
    caughtT+=dt;
    $('flash').style.opacity=Math.max(0,.55-caughtT*.6).toFixed(2);
    if(caughtT>1.6&&overlay.style.display==='none'){showEnd(false);}
  }
  // 아이템, 전등
  for(const it of items){it.t+=dt;it.g.rotation.y+=dt*1.6;it.g.position.y=it.y+Math.sin(it.t*2.2)*.12;}
  if(fixtures.length)updateFixtures(dt);
  updateDoorsDrawers(dt);
  for(const L of lamps){L.t+=dt;const f=Math.random()<.04?rand(0,.3):1;const v=L.base*(.75+.25*Math.sin(L.t*13)*Math.sin(L.t*3.1))*f;L.l.intensity=v;L.bulb.visible=f>.5;}
  if(exitGlow&&gate.open){gate.lift=Math.min(H-.3,gate.lift+dt*1.4);gate.mesh.position.y=gate.lift;exitGlow.material.opacity=.7+.3*Math.sin(playT*4);}
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0;}

  // 카메라
  if(state==='caught'||hidden||state==='over')handLight.visible=!hidden&&state==='play';
  scheduleMusic();
  renderBest(dt);
  edgeTurn(dt);
  cv.style.cursor=(state==='play'&&!isTouch)?'none':'default';
  scene.fog.density+=((mode==='ghost'&&state==='play'?.006:hidden?.029:.04)-scene.fog.density)*Math.min(1,dt*4);
  if(mode==='ghost'&&state==='play'){
    handLight.visible=false;flashlight.intensity=0;
    camera.position.copy(GH.pos);
    const cp=Math.cos(pitch);camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camLook(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    aura.position.copy(GH.pos);aura.color.setHex(0xbfd0ff);aura.distance=22;aura.intensity=GH.pos.y<H?.9:0;
  }else if(state==='caught'){
    const hx=M.pos.x+Math.sin(M.face)*1.25,hz=M.pos.z+Math.cos(M.face)*1.25;
    camera.position.set(hx+rand(-1,1)*shake,4.05+rand(-1,1)*shake,hz+rand(-1,1)*shake);
    camLook(M.pos.x,4.15,M.pos.z);
    mo.head.rotation.z=Math.sin(caughtT*40)*.06;
    flashlight.position.copy(camera.position);flashlight.target.position.set(M.pos.x,4.1,M.pos.z);flashlight.intensity=2;
  }else if(hidden){
    const c=hidden;
    camera.position.set(c.x+c.fx*c.S.camF,c.S.camY+Math.sin(playT*1.3)*.01,c.z+c.fz*c.S.camF);
    const a=Math.atan2(c.fx,c.fz)+hideYaw+Math.sin(playT*.7)*.03;
    const ty=camera.position.y+(c.S.lookY-c.S.camY)-Math.tan(hidePitch)*6;
    camLook(camera.position.x+Math.sin(a)*6,ty,camera.position.z+Math.cos(a)*6);
    flashlight.intensity=0;
    // 틈새로 들어오는 희미한 빛
    aura.position.set(c.x+c.fx*(c.S.out+1.6),1.6,c.z+c.fz*(c.S.out+1.6));aura.intensity=.75;aura.distance=11;
  }else{
    if(state==='menu'){yaw+=dt*.08;}
    camTarget.lerp(tmp.set(P.pos.x,0,P.pos.z),1-Math.exp(-dt*20));
    const spdNow=Math.hypot(P.vel.x,P.vel.z);
    bobT+=dt*spdNow*1.9;const bobAmt=Math.min(1,spdNow/WALK)*(P.running?.075:.045);
    P.eyeH=(P.eyeH||1.68)+(((P.crouch&&state==='play')?1.0:1.68)-(P.eyeH||1.68))*Math.min(1,dt*10);
    P.stairYs=(P.stairYs||0)+((P.stairY||0)-(P.stairYs||0))*Math.min(1,dt*12);
    const eyeY=P.eyeH+P.stairYs+Math.sin(bobT)*bobAmt*(P.crouch?.5:1);
    const sideBob=Math.cos(bobT*.5)*bobAmt*.6;
    camera.position.set(camTarget.x+Math.cos(yaw)*sideBob,eyeY,camTarget.z-Math.sin(yaw)*sideBob);
    if(shake>0){camera.position.x+=rand(-1,1)*shake;camera.position.y+=rand(-1,1)*shake;}
    const cp=Math.cos(pitch);
    camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camLook(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    // 손에 든 라이터
    handLight.position.set(.3+Math.cos(bobT*.5)*bobAmt*.5,-.36+Math.abs(Math.sin(bobT))*bobAmt*.4,-.55);
    handLight.visible=state==='play';
    flashlight.position.set(camera.position.x+Math.cos(yaw)*.3,camera.position.y-.2,camera.position.z-Math.sin(yaw)*.3);
    flashlight.target.position.set(camera.position.x+camDir.x*10,camera.position.y+camDir.y*10-1,camera.position.z+camDir.z*10);
    // 불꽃 흔들림 (괴물이 가까우면 더 심하게)
    const mdist=Math.hypot(M.pos.x-P.pos.x,M.pos.z-P.pos.z),fear=M.state==='sleep'?0:clamp(1-(mdist-2)/9,0,1);
    lighterT+=dt;
    let fl=.85+.08*Math.sin(lighterT*11)+.06*Math.sin(lighterT*23.7)+rand(-.04,.04);
    if(fear>0&&Math.random()<fear*.25)fl*=rand(.35,.8);
    const lit=P.flashOn;
    flashlight.color.setHex(0xff9a40);flashlight.angle=1.2;flashlight.distance=15;flashlight.penumbra=1;flashlight.intensity=lit?1.7*fl:0;
    aura.position.set(camera.position.x+Math.cos(yaw)*.35-Math.sin(yaw)*.5,camera.position.y-.1,camera.position.z-Math.sin(yaw)*.35-Math.cos(yaw)*.5);
    aura.intensity=lit?1.0*fl:.22;aura.distance=lit?9.5:5;aura.color.setHex(lit?0xff8a30:0x4a5a80);
    flame.visible=lit;flame.scale.set(1,fl*(1+fear*Math.random()*.5),1);flame.rotation.z=Math.sin(lighterT*7)*.12+P.vel.x*0;
    flameGlow.material.opacity=lit?fl:0;
  }
  if(shake>0)shake=Math.max(0,shake-dt*(state==='caught'?.05:1.2));
  floorPass();floorCull();
  distCullT-=dt;if(distCullT<=0&&world1){distCullT=.25;distCull(mode==='ghost'?1e9:48);}
  // 그림자: 꺼진 빛은 그림자 갱신 생략, 촛불 그림자(큐브맵 6면)는 2프레임에 한 번만
  frameN++;flashlight.shadow.autoUpdate=false;flashlight.shadow.needsUpdate=flashlight.intensity>0;
  {const l0=lampLights[0];l0.shadow.autoUpdate=false;l0.shadow.needsUpdate=l0.intensity>0&&frameN%3===0;}
  renderer.render(scene,camera);
}

// 메뉴 배경
buildWorld();P.pos.copy(startPos);monsters.forEach((x,k)=>{x.M.pos.copy(monsterSpawns[k]||monsterSpawn);x.group.position.copy(x.M.pos);x.group.position.y=-.3;});parkMon(monsters[2]);monsters.slice(3).forEach(parkMon);
camTarget.set(P.pos.x,1.75,P.pos.z);
showMenu();loop();
})();
