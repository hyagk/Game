<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>몽글이의 악몽</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"Jua",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
canvas{display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.85) 100%);z-index:1}
#monVis{background:radial-gradient(ellipse at center,rgba(110,0,0,.06) 35%,rgba(45,0,0,.7) 100%);display:none;z-index:1}
.modes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button.go.mon{background:#4a1d6e;box-shadow:0 4px 0 #2a0e40}
button.go.sub{background:#2a2e36;box-shadow:0 4px 0 #15171c;font-size:19px;padding:12px 22px}
#bestWrap{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap;justify-content:center}
#bestView{width:300px;height:340px;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#2a1410 0%,#0b0708 70%);border:1px solid #2a2e36;flex:none}
#bestView canvas{display:block}
.btabs{display:flex;gap:6px;justify-content:center;margin:0 0 12px;flex-wrap:wrap}
.btab{font-family:inherit;font-size:16px;color:#cfd3db;background:#1d2027;border:1px solid #2f343e;border-radius:10px;padding:7px 12px;cursor:pointer}
.btab.on{background:#5a1616;border-color:#a52a2a;color:#fff}
.binfo{text-align:left;max-width:300px;flex:1 1 240px}
.binfo h2{margin:0 0 2px;font-weight:400;font-size:26px}
.binfo .tag{color:#8a909c;font-size:14px;margin-bottom:10px}
.binfo table{width:100%;border-collapse:collapse;font-size:14px;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;color:#c5cad3}
.binfo td{padding:5px 0;border-bottom:1px solid #22262e;vertical-align:top}
.binfo td:first-child{color:#8a909c;width:64px;white-space:nowrap}
.binfo p{font-size:14px;line-height:1.55;color:#aeb4bf;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;margin:10px 0 0}
.card.wide{max-width:680px}
#red{background:radial-gradient(ellipse at center,rgba(120,0,0,0) 35%,rgba(170,0,0,.75) 100%);opacity:0;z-index:1}
#slits{display:none;z-index:1;background:repeating-linear-gradient(180deg,#050302 0 34px,rgba(0,0,0,0) 34px 46px)}
#flash{background:#b00000;opacity:0;z-index:6;transition:opacity .7s}
#compass{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:74px;height:74px;border-radius:50%;background:radial-gradient(circle,#f3ead2 0 58%,#8a6a2a 60% 68%,#3a2a10 70%);box-shadow:0 2px 10px #000a;display:none;z-index:6;pointer-events:none}
#cNeedle{position:absolute;left:50%;top:50%;width:6px;height:56px;margin:-28px 0 0 -3px;background:linear-gradient(#c81818 0 50%,#2a2a30 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
#cTxt{position:absolute;top:80px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;color:#f3e2b0;text-shadow:0 1px 3px #000}
#hud{position:fixed;top:12px;left:12px;z-index:2;display:none;flex-direction:column;gap:7px;pointer-events:none;text-shadow:0 2px 3px #000}
.row{display:flex;align-items:center;gap:8px;font-size:18px}
.bar{width:130px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.bar>div{height:100%;width:100%;border-radius:6px}
#fuseTxt{font-size:24px;color:#ffd257}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);font-size:22px;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;display:none;z-index:2;pointer-events:none;white-space:nowrap}
#msg{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font-size:30px;text-align:center;text-shadow:0 0 12px #000,0 2px 2px #000;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:7}
.card{background:#121418;border:1px solid #2a2e36;border-radius:18px;padding:26px 24px 20px;max-width:390px;width:calc(100% - 44px);text-align:center;box-shadow:0 0 40px rgba(160,0,0,.25)}
.card h1{margin:0 0 6px;font-size:36px;font-weight:400;color:#e8e8e8;letter-spacing:1px}
.card h1 b{color:#d42a2a;font-weight:400}
.card .sub{margin:0 0 14px;color:#9aa0ab;font-size:16px;line-height:1.5}
.card ul{list-style:none;padding:0;margin:0 0 18px;text-align:left;font-size:14.5px;line-height:1.6;color:#c5cad3;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.card li{padding:2px 0 2px 26px;position:relative}
.card li i{position:absolute;left:0;font-style:normal}
.card .big{font-size:52px;margin:6px 0 0;line-height:1.1}
.card .meta{color:#9aa0ab;margin:8px 0 16px;font-size:17px}
button.go{font-family:inherit;font-size:23px;color:#fff;background:#a51d1d;border:none;border-radius:12px;padding:12px 38px;box-shadow:0 4px 0 #5e0e0e;cursor:pointer}
button.go:active{transform:translateY(3px);box-shadow:0 1px 0 #5e0e0e}
.keys{font-size:12.5px;color:#6f7580;margin-top:12px;font-family:system-ui,sans-serif;line-height:1.5}
#joy{position:fixed;left:22px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none;z-index:4;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none}
.tbtn{position:fixed;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,20,25,.6);color:#fff;font-family:inherit;font-size:16px;display:none;z-index:4;touch-action:none}
#bRun{right:24px;bottom:30px;width:88px;height:88px;background:rgba(120,25,25,.7)}
#bHide{right:196px;bottom:40px}
#bLight{right:110px;bottom:40px}
#bTorch{right:24px;bottom:228px;background:rgba(150,140,60,.6)}
#bFire{right:118px;bottom:228px;background:rgba(170,40,40,.6)}
#bMirror{right:212px;bottom:228px;background:rgba(80,130,190,.6)}
#bCrouch{right:24px;bottom:132px;left:auto}
#bFairy{right:212px;bottom:134px;background:rgba(60,160,120,.6)}
#bShoot{right:128px;bottom:138px;width:86px;height:86px;background:rgba(30,90,170,.75)}
#fsBtn{position:fixed;top:12px;right:156px;z-index:8;font-size:18px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit}
#pauseBtn{position:fixed;top:12px;right:112px;z-index:8;font-size:18px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 11px;cursor:pointer;font-family:inherit;display:none}
.sens{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0 4px;color:#c5cad3;font-size:16px}
.sens input{width:170px;accent-color:#a52a2a}
#musBtn{position:fixed;top:12px;right:12px;z-index:4;font-size:20px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px;cursor:pointer;display:none}
#stunTxt{color:#7fc4ff;display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 4px #000;z-index:2;pointer-events:none;display:none}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="fx" id="vig"></div>
<div class="fx" id="red"></div>
<div class="fx" id="monVis"></div>
<div class="fx" id="slits"></div>
<div class="fx" id="flash"></div>
<div id="compass"><div id="cNeedle"></div><div id="cTxt"></div></div>
<div id="hud">
  <div class="row" id="fuseTxt">⚡ 퓨즈 0 / 5</div>
  <div class="row">🏃 <div class="bar"><div id="staBar" style="background:#7fd0ff"></div></div></div>
  <div class="row" id="keyTxt">🔑 열쇠 0</div>
  <div class="row" id="itemTxt"></div>
  <div class="row" id="stunTxt"></div>
</div>
<div id="prompt"></div>
<div id="msg"></div>
<div id="joy"><div id="knob"></div></div>
<button class="tbtn" id="bRun">달리기</button>
<button class="tbtn" id="bHide">행동</button>
<button class="tbtn" id="bLight">🔥</button>
<button class="tbtn" id="bShoot">쏘기</button>
<button class="tbtn" id="bTorch">🔦</button>
<button class="tbtn" id="bFire">🎆</button>
<button class="tbtn" id="bMirror">🪞</button>
<button class="tbtn" id="bFairy">🧚</button>
<button class="tbtn" id="bCrouch">앉기</button>
<button id="musBtn">🎵</button>
<button id="pauseBtn">⏸</button>
<button id="ghostExit" style="display:none;position:fixed;top:12px;left:12px;z-index:8;font-family:inherit;font-size:17px;background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:7px 12px;cursor:pointer">← 메뉴로</button>
<button id="fsBtn" title="전체화면">⛶ 전체화면</button>
<div id="cross"></div>
<div id="overlay"></div>
<div id="err">3D 그래픽을 불러오지 못했어요. 새로고침하거나 다른 브라우저로 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const $=id=>document.getElementById(id);
const PI=Math.PI,V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ================= 설정 =================
const N0=15,G0=2*N0+1,OFF=G0+1,G=OFF+G0,N=(G-1)/2,T=4,H=4.6; // 1층: x 0..G0-1, 2층: x OFF..G-1 (z는 0..G0-1)
const PR=0.45,WALK=4.6,RUN=7.6;
const NEED=5,VAULTS=12,OPENROOMS=14,SMALLROOMS=18;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// ================= 렌더러 =================
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){$('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030405);
scene.fog=new THREE.FogExp2(0x040504,0.055);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,200);
scene.add(camera);
const handLight=new THREE.Group();camera.add(handLight);
const handGun=new THREE.Group();camera.add(handGun);
const torchModel=new THREE.Group();camera.add(torchModel);torchModel.visible=false;
(function(){const b=new THREE.Mesh(new THREE.CylinderGeometry(.03,.026,.26,12),new THREE.MeshBasicMaterial({color:0xc8b840}));b.rotation.x=PI/2;torchModel.add(b);
  const h=new THREE.Mesh(new THREE.CylinderGeometry(.048,.035,.07,14),new THREE.MeshBasicMaterial({color:0x2a2a2a}));h.rotation.x=PI/2;h.position.z=-.16;torchModel.add(h);
  const l=new THREE.Mesh(new THREE.CircleGeometry(.042,14),new THREE.MeshBasicMaterial({color:0xfffbe8}));l.position.z=-.196;l.rotation.y=PI;torchModel.add(l);
  torchModel.position.set(.12,-.32,-.5);torchModel.rotation.set(.05,.05,0);})();
const coilMat=new THREE.MeshBasicMaterial({color:0x48b8ff});
(function(){const dark=new THREE.MeshBasicMaterial({color:0x22252b}),mid=new THREE.MeshBasicMaterial({color:0x3a3f48});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.075,.1,.32),mid);handGun.add(body);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.022,.026,.18,10),dark);barrel.rotation.x=PI/2;barrel.position.set(0,.015,-.24);handGun.add(barrel);
  [0,1,2].forEach(k=>{const c=new THREE.Mesh(new THREE.TorusGeometry(.036,.009,6,14),coilMat);c.position.set(0,.015,-.17-k*.04);handGun.add(c);});
  const grip=new THREE.Mesh(new THREE.BoxGeometry(.06,.14,.07),dark);grip.position.set(0,-.1,.08);grip.rotation.x=-.25;handGun.add(grip);
  const hand=new THREE.Mesh(new THREE.BoxGeometry(.085,.075,.11),new THREE.MeshBasicMaterial({color:0x6b4a3a}));hand.position.set(0,-.1,.09);handGun.add(hand);
  handGun.visible=false;})();
const muzzle=new THREE.Sprite(new THREE.SpriteMaterial({map:null,color:0x7fd0ff,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false,opacity:0}));
muzzle.scale.set(.25,.25,1);muzzle.position.set(0,.015,-.36);handGun.add(muzzle);
const lensMat=new THREE.MeshBasicMaterial({color:0xffb347});
const flame=new THREE.Group();
const flameGlow=new THREE.Sprite(new THREE.SpriteMaterial({color:0xff9a30,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));
(function(){const metal=new THREE.MeshBasicMaterial({color:0x8a8f98}),red=new THREE.MeshBasicMaterial({color:0x8a1d1d});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.03),red);handLight.add(body);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.052,.03,.032),metal);cap.position.y=.065;handLight.add(cap);
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.02,10),metal);wheel.rotation.z=PI/2;wheel.position.set(0,.085,.008);handLight.add(wheel);
  const core=new THREE.Mesh(new THREE.ConeGeometry(.013,.05,8),new THREE.MeshBasicMaterial({color:0xfff2b0}));core.position.y=.025;flame.add(core);
  const outer=new THREE.Mesh(new THREE.ConeGeometry(.022,.075,8),new THREE.MeshBasicMaterial({color:0xff8a20,transparent:true,opacity:.8}));outer.position.y=.035;flame.add(outer);
  flameGlow.scale.set(.22,.22,1);flameGlow.position.y=.03;flame.add(flameGlow);
  flame.position.y=.1;handLight.add(flame);
  const hand=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.1),new THREE.MeshBasicMaterial({color:0x6b4a3a}));hand.position.set(0,-.05,.03);handLight.add(hand);
  handLight.rotation.set(0,-.15,0);handLight.visible=false;})();

const ambLight=new THREE.AmbientLight(0x2a3550,0.32);scene.add(ambLight);
const hemiLight=new THREE.HemisphereLight(0x223047,0x0a0806,0.25);scene.add(hemiLight);

const flashlight=new THREE.SpotLight(0xff9a40,1.7,15,1.2,1,1.5);
flashlight.castShadow=true;flashlight.shadow.mapSize.set(1024,1024);flashlight.shadow.camera.near=0.3;flashlight.shadow.bias=-0.0006;
scene.add(flashlight);scene.add(flashlight.target);
const aura=new THREE.PointLight(0xff8a30,0.9,9,1.6);scene.add(aura);
const candleLights=[];for(let k=0;k<0;k++){const l=new THREE.PointLight(0xff7a2a,0,11,1.7);if(k===0){l.castShadow=true;l.shadow.mapSize.set(512,512);l.shadow.bias=-.004;l.shadow.camera.near=.1;l.shadow.camera.far=12;}scene.add(l);candleLights.push(l);}

// ================= 텍스처 =================
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);}return t;}
const floorTex=canvasTex(256,256,(g,w,h)=>{
  // 낡은 학교 마룻바닥: 밝은 갈색 판자, 긁힘, 닳은 자국
  for(let c=0;c<8;c++){const x=c*32;g.fillStyle=`hsl(${26+Math.random()*6},${30+Math.random()*10}%,${22+Math.random()*8}%)`;g.fillRect(x,0,32,h);
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,0,2,h);const off=Math.random()*256;g.fillRect(x,off,32,2);
    for(let k=0;k<18;k++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,230,190'},${Math.random()*.06})`;g.fillRect(x+3+Math.random()*26,0,1,h);}}
  for(let i=0;i<60;i++){g.strokeStyle=`rgba(255,235,200,${Math.random()*.08})`;g.beginPath();const x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);g.lineTo(x+rand(-20,20),y+rand(-6,6));g.stroke();}
  for(let i=0;i<800;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.22})`;g.fillRect(Math.random()*w,Math.random()*h,1,2+Math.random()*5);}
  const gr=g.createRadialGradient(128,128,20,128,128,180);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=gr;g.fillRect(0,0,w,h);
},(G*T)/4);
const wallTex=canvasTex(256,256,(g,w,h)=>{
  // 낡은 교실 벽: 위는 칙칙한 녹회색 회벽, 아래는 짙은 나무 판자
  const koshiY=h*.7;
  g.fillStyle='#5c6152';g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){g.fillStyle=Math.random()<.5?`rgba(30,32,24,${Math.random()*.14})`:`rgba(170,175,150,${Math.random()*.07})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
  for(let i=0;i<9;i++){g.fillStyle=`rgba(25,22,12,${rand(.06,.16)})`;g.beginPath();g.ellipse(Math.random()*w,rand(10,koshiY),rand(10,30),rand(16,50),0,0,7);g.fill();}
  // 물 자국 (위에서 흘러내림)
  for(let i=0;i<4;i++){const x=Math.random()*w;const gr=g.createLinearGradient(0,0,0,koshiY);gr.addColorStop(0,'rgba(20,18,10,.25)');gr.addColorStop(1,'rgba(20,18,10,0)');g.fillStyle=gr;g.fillRect(x,0,rand(4,14),rand(40,koshiY));}
  g.fillStyle='#3a3d33';g.fillRect(0,0,w,10);
  // 아래 판자
  g.fillStyle='#3a2616';g.fillRect(0,koshiY,w,h-koshiY);
  for(let x=0;x<w;x+=18){g.fillStyle=`rgba(${80+Math.random()*30},${52+Math.random()*15},${28+Math.random()*10},.5)`;g.fillRect(x+1,koshiY+3,16,h-koshiY-8);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(x,koshiY,1.5,h-koshiY);}
  g.fillStyle='#24170c';g.fillRect(0,koshiY-5,w,7);g.fillStyle='rgba(255,220,170,.08)';g.fillRect(0,koshiY-5,w,1.5);
  g.fillStyle='#160e07';g.fillRect(0,h-7,w,7);
  // 양끝 기둥
  const post=(x)=>{g.fillStyle='#2e1e10';g.fillRect(x,0,12,h);g.fillStyle='rgba(255,215,160,.06)';g.fillRect(x+2,0,2,h);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x+9,0,3,h);};
  post(0);post(w-12);
});

const glowTex=canvasTex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});
flameGlow.material.map=glowTex;flameGlow.material.needsUpdate=true;
const tatamiTex=canvasTex(128,256,(g,w,h)=>{
  g.fillStyle='#8f8a52';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=2){g.fillStyle=`rgba(${60+Math.random()*30},${60+Math.random()*25},20,${.18+Math.random()*.12})`;g.fillRect(0,y,w,1);}
  g.fillStyle='#2b2418';g.fillRect(0,0,10,h);g.fillRect(w-10,0,10,h);
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,0,w,2);g.fillRect(0,h-2,w,2);
});

function genMaze(){
  grid=Array.from({length:G},()=>Array(G).fill(1));
  for(let f=0;f<2;f++){
    const ox=f*OFF;
    const vis=new Set(['0,0']),stack=[[0,0]];grid[ox+1][1]=0;
    while(stack.length){
      const [cx,cy]=stack[stack.length-1];
      const nb=DIRS.map(([dx,dy])=>[cx+dx,cy+dy,dx,dy]).filter(([x,y])=>x>=0&&y>=0&&x<N0&&y<N0&&!vis.has(x+','+y));
      if(!nb.length){stack.pop();continue;}
      const [nx,ny,dx,dy]=pick(nb);grid[ox+2*cx+1+dx][2*cy+1+dy]=0;grid[ox+2*nx+1][2*ny+1]=0;vis.add(nx+','+ny);stack.push([nx,ny]);
    }
    for(let k=0;k<N0*N0*.2;k++){const i=ox+1+Math.floor(Math.random()*(G0-2)),j=1+Math.floor(Math.random()*(G0-2));if(grid[i][j]===1&&((i%2)+(j%2))===1)grid[i][j]=0;}
    for(let k=0;k<4;k++){const i=ox+1+2*Math.floor(Math.random()*(N0-1)),j=1+2*Math.floor(Math.random()*(N0-1));for(let a=i;a<=i+2;a++)for(let b=j;b<=j+2;b++)grid[a][b]=0;}

// 계단 2곳: 1층 칸 (i,j) ↔ 2층 칸 (i+OFF,j). 두 칸 모두 막다른 칸으로 만들고 BFS에서 서로 연결
function makeStairs(){
  stairs=[];stairLink=new Map();noOpen=new Set();
  const cand=[];for(let i=3;i<=G0-4;i+=2)for(let j=3;j<=G0-4;j+=2)if(i>9||j>9)cand.push([i,j]);
  for(const [i,j] of shuffle(cand)){
    if(stairs.length>=4)break;
    if(stairs.some(s=>Math.hypot(s.i%OFF-i,s.j-j)<12))continue;
    const ends=[];let ok=true;
    for(const f of [0,1]){const ci=i+f*OFF;
      if(grid[ci][j]!==0){ok=false;break;}
      // 홀(3x3 빈 공간) 안이면 제외
      let diag=0;for(const [a,b] of [[1,1],[1,-1],[-1,1],[-1,-1]])if(grid[ci+a][j+b]===0)diag++;
      if(diag){ok=false;break;}
      const open=DIRS.filter(([a,b])=>grid[ci+a][j+b]===0);if(!open.length){ok=false;break;}
      ends.push({ci,open});}
    if(!ok)continue;

function bfsPath(si,sj,ti,tj){

function updateFixtures(dt){

let AC=null,master=null,noiseB=null;
function initAudio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
      const len=AC.sampleRate*2;noiseB=AC.createBuffer(1,len,AC.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      const g=AC.createGain();g.gain.value=.05;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;
      [43.6,46.3,65.4].forEach(f=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start();});
      const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.08;lg.gain.value=.025;lfo.connect(lg);lg.connect(g.gain);lfo.start();
      lp.connect(g);g.connect(master);}
    if(AC.resume)AC.resume();
    initMusic();
  }catch(e){AC=null;}
}
function osc(f,d,type,v,slide,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(Math.max(.0002,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}catch(e){}}
function noise(d,v,freq,q,delay){if(!AC)return;try{const t=AC.currentTime+(delay||0),s=AC.createBufferSource();s.buffer=noiseB;const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=freq;bf.Q.value=q;
  const g=AC.createGain();g.gain.setValueAtTime(Math.max(.0002,v),t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(bf);bf.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+d+.05);}catch(e){}}

let musicOn=true,musBus=null,musNext=0,musStep=0;
const BEAT=60/66/2;
const CH=[[57,60,64],[53,57,60],[50,53,57],[52,56,59]];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function initMusic(){
  if(!AC||musBus)return;
  musBus=AC.createGain();musBus.gain.value=.55;
  const dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=BEAT*3;fb.gain.value=.38;wet.gain.value=.45;
  musBus.connect(master);musBus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
}
function mnote(f,t,d,type,v,lp){try{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.6,d*.25));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  if(lp){const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=lp;o.connect(f2);f2.connect(g);}else o.connect(g);
  g.connect(musBus);o.start(t);o.stop(t+d+.05);}catch(e){}}
function pluck(f,t,v){try{const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();o.type='sine';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.01;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+1.6);const g2=AC.createGain();g2.gain.value=.25;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(musBus);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);}catch(e){}}
function scheduleMusic(){
  if(!AC||!musBus||!musicOn||(state!=='play'))return;
  const now=AC.currentTime;if(musNext<now)musNext=now+.05;
  const chase=mode==='monster'?(S.state==='flee'||S.state==='toHide'):(M.state==='chase'||M.state==='closet');
  while(musNext<now+.25){
    const t=musNext,bar=Math.floor(musStep/8)%4,pos=musStep%8,ch=CH[bar];
    if(pos===0){ch.forEach(n=>mnote(mtof(n-12),t,BEAT*8.5,'triangle',.05,700));mnote(mtof(ch[0]-24),t,BEAT*8.5,'sine',.08);}
    const pat=[0,2,1,2,0,3,1,2];
    if(Math.random()<(chase?.95:.8)){const p=pat[pos],n=p===3?ch[0]+24:ch[p]+12;pluck(mtof(n+(Math.random()<.06?1:0)),t,.07);}
    if(chase){if(pos%2===0){mnote(55,t,.25,'sine',.22);noise(.06,.05,180,1,t-now);}if(pos===4)mnote(mtof(ch[0]+1),t,BEAT*3,'sawtooth',.03,1200);}
    musNext+=chase?BEAT*.75:BEAT;musStep++;
  }
}

function pushAABB(p,r,x0,z0,x1,z1){
  const cx=clamp(p.x,x0,x1),cz=clamp(p.z,z0,z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return;
  if(d2>1e-9){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
  else{const a=p.x-x0,b=x1-p.x,c=p.z-z0,e=z1-p.z,m=Math.min(a,b,c,e);if(m===a)p.x=x0-r;else if(m===b)p.x=x1+r;else if(m===c)p.z=z0-r;else p.z=z1+r;}
}
function collide(p,r){
  const ci=tileOf(p.x),cj=tileOf(p.z);
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++)if(solid(i,j))pushAABB(p,r,i*T,j*T,i*T+T,j*T+T);
  for(const c of closets)pushAABB(p,r,c.minX,c.minZ,c.maxX,c.maxZ);
  for(const c of furnBoxes)pushAABB(p,r,c.minX,c.minZ,c.maxX,c.maxZ);
}
function interactTarget(){

  const cl=nearCloset();if(cl){const d=Math.hypot(P.pos.x-(cl.x+cl.fx*cl.S.out),P.pos.z-(cl.z+cl.fz*cl.S.out));if(d<bd){bd=d;best={type:'hide',c:cl};}}
  const cd=nearCandle();if(cd&&cd.d<bd){bd=cd.d;best={type:'candle',c:cd.c};}
  for(const w of drawers){if(w.opened)continue;const d=Math.hypot(P.pos.x-(w.x+w.fx*.9),P.pos.z-(w.z+w.fz*.9));if(d<1.5&&d<bd){bd=d;best={type:'drawer',c:w};}}
  for(const dr of doors){if(dr.open)continue;const d=Math.hypot(P.pos.x-dr.fx,P.pos.z-dr.fz);if(d<2.0&&d<bd){bd=d;best={type:'door',c:dr};}}

let scratchTex=null;
function getScratchTex(){
  if(scratchTex)return scratchTex;
  const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
  // 가운데 검은 틈 (인형이 숨어 있는 곳)
  const gr=x.createRadialGradient(128,128,4,128,128,46);gr.addColorStop(0,'rgba(0,0,0,.95)');gr.addColorStop(.6,'rgba(10,4,2,.6)');gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr;x.beginPath();x.arc(128,128,46,0,Math.PI*2);x.fill();
  // 손톱으로 긁은 자국 (3~4줄씩 여러 묶음)
  x.lineCap='round';
  for(let k=0;k<6;k++){const a=Math.random()*Math.PI*2,r0=30+Math.random()*20,len=50+Math.random()*50,bend=(Math.random()-.5)*.5;
    for(let f=0;f<4;f++){const off=(f-1.5)*7,px=-Math.sin(a)*off,pz=Math.cos(a)*off;
      x.strokeStyle=`rgba(${20+Math.random()*30},${8+Math.random()*10},${6},${.55+Math.random()*.35})`;x.lineWidth=2+Math.random()*2.5;
      x.beginPath();x.moveTo(128+Math.cos(a)*r0+px,128+Math.sin(a)*r0+pz);
      x.quadraticCurveTo(128+Math.cos(a+bend)*(r0+len*.5)+px,128+Math.sin(a+bend)*(r0+len*.5)+pz,128+Math.cos(a+bend*1.5)*(r0+len)+px,128+Math.sin(a+bend*1.5)*(r0+len)+pz);x.stroke();
      // 긁힌 자리의 밝은 나무 결
      x.strokeStyle='rgba(200,170,130,.25)';x.lineWidth=1;x.stroke();}}
  scratchTex=new THREE.CanvasTexture(c);return scratchTex;
}

  // 아이템 / 양초 / 탈출
  if(S.state!=='hide'){
    for(let k=items.length-1;k>=0;k--){const it=items[k];if(it.type!=='fuse')continue;if(Math.hypot(S.pos.x-it.g.position.x,S.pos.z-it.g.position.z)<1.0){
      world.remove(it.g);items.splice(k,1);fuses++;S.path=[];S.repath=0;
      if(fuses>=NEED)openGate();else msg('⚡ 생존자가 퓨즈를 찾았다 ('+fuses+' / '+NEED+')',2);}}
    for(const c of candles){if(!c.lit&&Math.hypot(c.x-S.pos.x,c.z-S.pos.z)<1.4&&Math.random()<dt*1.5){c.lit=true;c.t=0;candleTimer=0;}}

  }

  if(state==='play'&&S.state!=='hide'&&dist<1.4)monsterEnd(true);
  // 모습
  player.position.copy(S.pos);player.rotation.y=S.face;
  const spd=Math.hypot(S.vel.x,S.vel.z);
  S.anim+=dt*(4+spd*1.6);const sw=Math.sin(S.anim)*Math.min(1,spd/3.4)*.7;

}

function updateMonsterPlayer(dt){
  if(lightReq){lightReq=false;roar();}

  MP.openCD=Math.max(0,MP.openCD-dt);R.cd=Math.max(0,R.cd-dt);R.markT=Math.max(0,R.markT-dt);
  if(MP.frozen>0){MP.frozen-=dt;MP.vel.set(0,0,0);return;}
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy;
  let str=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
  const il=Math.hypot(fwd,str);if(il>1){fwd/=il;str/=il;}
  const wantRun=(keys.ShiftLeft||keys.ShiftRight||runBtn)&&il>.15;
  MP.running=wantRun&&(MP.running?MP.stamina>0:MP.stamina>15);
  if(MP.running){MP.stamina=Math.max(0,MP.stamina-dt*14);MP.staDelay=1;}else{MP.staDelay-=dt;if(MP.staDelay<=0)MP.stamina=Math.min(100,MP.stamina+dt*12);}

  let near=null,bd=2.3;for(const c of closets){const [qx,qz]=spotFront(c),d=Math.hypot(M.pos.x-qx,M.pos.z-qz);if(d<bd){bd=d;near=c;}}

      const k=x.mo.kind;
      if(k==='stalker'){x.sndT=2.5;const v=clamp(1-d/34,0,1);if(v>0)sfx.hum(.03+v*v*.32);continue;}
      if(k==='weeper'){const v=clamp(1-d/(x.M.state==='weep'?34:26),0,1);if(x.M.state==='weep'){x.sndT=x.M.wakeT>0?99:rand(2.2,2.8);if(v>0&&x.M.wakeT<=0)sfx.sob(.04+v*v*.4);}else{x.sndT=ch?1.4:2.5;if(v>0)sfx.wail(.02+v*v*.22);}continue;}
      if(k==='bell'){x.sndT=ch?rand(.28,.4):rand(.8,1.5);const v=clamp(1-d/30,0,1);if(v>0)sfx.bell(.02+v*v*.16);x.mo.bell.rotation.z=.6;}
      else if(k==='twin'){x.sndT=2.5;const v=clamp(1-d/32,0,1);if(v>0)sfx.giggle(.03+v*v*.3,ch);}
      else{x.sndT=2.5;const v=clamp(1-d/32,0,1);if(v>0)sfx.growl(.03+v*v*.5,ch);}
    }
    for(const x of activeMons())if(x.mo.bell)x.mo.bell.rotation.z*=Math.pow(.02,dt);
  }
  if(state==='play'&&mode==='ghost'){
    playT+=dt;updateGhost(dt);for(const x of activeMons())useMon(x),updateMonster(dt);useMon(monsters[0]);prompt.style.display='none';
  }else if(state==='play'&&mode==='monster'){
    playT+=dt;
    updateMonsterPlayer(dt);
    const sd=updateSurvivor(dt);
    const close=clamp(1-sd/16,0,1);
    heartT-=dt;if(heartT<=0&&close>.05){heartT=1.2-close*.75;sfx.heart(.04+close*.26);}
    $('red').style.opacity=(close*.3).toFixed(2);
    updateHUDMonster();
  }else if(state==='play'){
    playT+=dt;
    updatePlayer(dt);
    updateFireworks(dt);updateDolls(dt);
    {let near=monsters[0];mDist=99;for(const x of activeMons()){useMon(x);const d=updateMonster(dt);if(state!=='play')break;if(d<mDist){mDist=d;near=x;}}useMon(near);}
    // 심장 박동
    const chase=M.state==='chase'||M.state==='closet';
    const close=clamp(1-mDist/(chase?30:20),0,1)*(M.state==='sleep'?.3:1);
    heartT-=dt;if(heartT<=0&&close>.05){heartT=1.15-close*.8;sfx.heart(.05+close*.32);}
    $('red').style.opacity=chase?(.25+close*.6).toFixed(2):(close*.35).toFixed(2);
    whisperT-=dt;if(whisperT<=0){whisperT=rand(14,30);if(Math.random()<.6)sfx.whisper();}
    // 안내
    const it=!hidden&&interactTarget();const c=it&&it.type==='hide'?it.c:null;
    const key=isTouch?'행동 버튼':'E';
    if(hidden){prompt.textContent=(isTouch?'행동 버튼':'E')+' — '+hidden.S.name+'에서 나가기';prompt.style.display='block';}
    else if(c){prompt.textContent=key+' — '+c.S.name+'에 숨기';prompt.style.display='block';}
    else if(it&&it.type==='candle'){prompt.textContent=key+' — 💡 전등 켜기';prompt.style.display='block';}
    else if(it&&it.type==='drawer'){const left=it.c.slots.filter(x=>!x.opened).length;prompt.textContent=key+' — 서랍 열기 ('+left+'/3칸 남음)';prompt.style.display='block';}
    else if(it&&it.type==='door'){prompt.textContent=!it.c.vault?key+' — 문 열기':keyCount>0?key+' — 🔑 열쇠로 문 열기':'🔒 잠긴 방 (열쇠 필요)';prompt.style.display='block';}
    else prompt.style.display='none';
    updateHUD();
  }else if(state==='caught'){
    caughtT+=dt;
    $('flash').style.opacity=Math.max(0,.55-caughtT*.6).toFixed(2);
    if(caughtT>1.6&&overlay.style.display==='none'){showEnd(false);}
  }
  // 아이템, 전등
  for(const it of items){it.t+=dt;it.g.rotation.y+=dt*1.6;it.g.position.y=it.y+Math.sin(it.t*2.2)*.12;}
  if(candles.length)updateCandles(dt);
  if(fixtures.length)updateFixtures(dt);
  updateDoorsDrawers(dt);
  for(const L of lamps){L.t+=dt;const f=Math.random()<.04?rand(0,.3):1;const v=L.base*(.75+.25*Math.sin(L.t*13)*Math.sin(L.t*3.1))*f;L.l.intensity=v;L.bulb.visible=f>.5;}
  if(exitGlow&&gate.open){gate.lift=Math.min(H-.3,gate.lift+dt*1.4);gate.mesh.position.y=gate.lift;exitGlow.material.opacity=.7+.3*Math.sin(playT*4);}
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0;}

  // 카메라
  if(state==='caught'||hidden||state==='over'||mode!=='survivor'){handLight.visible=mode==='survivor'&&!hidden&&state==='play';handGun.visible=false;torchModel.visible=false;}
  muzzle.material.opacity=Math.max(0,muzzle.material.opacity-dt*14);
  for(let k=tracers.length-1;k>=0;k--){const tr=tracers[k];tr.t-=dt;tr.ln.material.opacity=Math.max(0,tr.t*5);if(tr.t<=0){scene.remove(tr.ln);if(tr.ln.geometry&&!tr.ln.isSprite)tr.ln.geometry.dispose();tracers.splice(k,1);}}
  scheduleMusic();
  renderBest(dt);
  edgeTurn(dt);
  cv.style.cursor=(state==='play'&&!isTouch)?'none':'default';
  scene.fog.density+=((mode==='ghost'&&state!=='menu'?.004:mode==='monster'&&state!=='menu'?.032:hidden?.04:.06)-scene.fog.density)*Math.min(1,dt*4);
  if(mode==='ghost'&&state==='play'){
    handLight.visible=false;handGun.visible=false;torchModel.visible=false;mHands.visible=false;player.visible=false;
    camera.position.copy(GH.pos);
    const cp=Math.cos(pitch);camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camera.lookAt(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    flashlight.intensity=0;aura.position.copy(GH.pos);aura.color.setHex(0xbfd0ff);aura.distance=22;aura.intensity=GH.pos.y<H?.9:0;
    camera.far=400;camera.updateProjectionMatrix();
  }else if(mode==='monster'&&state!=='menu'){
    handLight.visible=false;handGun.visible=false;mHands.visible=state==='play';
    const spdNow=Math.hypot(MP.vel.x,MP.vel.z);
    bobT+=dt*spdNow*1.4;const bobAmt=Math.min(1,spdNow/4.4)*(MP.running?.11:.07);
    camera.position.set(M.pos.x,3.95+Math.sin(bobT)*bobAmt,M.pos.z);
    if(shake>0){camera.position.x+=rand(-1,1)*shake;camera.position.y+=rand(-1,1)*shake;}
    const cp=Math.cos(pitch);camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camera.lookAt(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    MP.lunge=Math.max(0,MP.lunge-dt*3);
    const swing=Math.sin(bobT*.5)*bobAmt*1.2;
    mHands.armL.position.set(-.42,-.48+swing*.3,-.55-MP.lunge*.25+swing*.2);mHands.armR.position.set(.42,-.48-swing*.3,-.55-MP.lunge*.25-swing*.2);
    mHands.armL.rotation.x=mHands.armR.rotation.x=.35-MP.lunge*.4;
    flashlight.intensity=0;
    // 생존자의 라이터 빛
    const lit=S.state!=='hide';lighterT+=dt;const fl=.85+.08*Math.sin(lighterT*11)+rand(-.05,.05);
    aura.position.set(S.pos.x+Math.sin(S.face)*.4+Math.cos(S.face)*.5,1.4,S.pos.z+Math.cos(S.face)*.4-Math.sin(S.face)*.5);
    aura.color.setHex(0xff8a30);aura.distance=9;aura.intensity=lit?fl:0;sGlow.visible=lit;sGlow.material.opacity=fl;
    marker.visible=R.markT>0;if(marker.visible){const c=S.state==='hide'&&S.spot;marker.position.set(c?c.x:S.pos.x,2.8,c?c.z:S.pos.z);marker.material.opacity=Math.min(1,R.markT)*(.7+.3*Math.sin(playT*12));}
  }else if(state==='caught'){
    const hx=M.pos.x+Math.sin(M.face)*1.25,hz=M.pos.z+Math.cos(M.face)*1.25;
    camera.position.set(hx+rand(-1,1)*shake,4.05+rand(-1,1)*shake,hz+rand(-1,1)*shake);
    camera.lookAt(M.pos.x,4.15,M.pos.z);
    mo.head.rotation.z=Math.sin(caughtT*40)*.06;
    flashlight.position.copy(camera.position);flashlight.target.position.set(M.pos.x,4.1,M.pos.z);flashlight.intensity=2;
  }else if(hidden){
    const c=hidden;
    camera.position.set(c.x+c.fx*c.S.camF,c.S.camY+Math.sin(playT*1.3)*.01,c.z+c.fz*c.S.camF);
    const a=Math.atan2(c.fx,c.fz)+hideYaw+Math.sin(playT*.7)*.03;
    const ty=camera.position.y+(c.S.lookY-c.S.camY)-Math.tan(hidePitch)*6;
    camera.lookAt(camera.position.x+Math.sin(a)*6,ty,camera.position.z+Math.cos(a)*6);
    flashlight.intensity=0;
    // 틈새로 들어오는 희미한 빛
    aura.position.set(c.x+c.fx*(c.S.out+1.6),1.6,c.z+c.fz*(c.S.out+1.6));aura.intensity=.75;aura.distance=11;
  }else{
    if(state==='menu'){yaw+=dt*.08;}
    camTarget.lerp(tmp.set(P.pos.x,0,P.pos.z),1-Math.exp(-dt*20));
    const spdNow=Math.hypot(P.vel.x,P.vel.z);
    bobT+=dt*spdNow*1.9;const bobAmt=Math.min(1,spdNow/WALK)*(P.running?.075:.045);
    P.eyeH=(P.eyeH||1.68)+(((P.crouch&&state==='play')?1.0:1.68)-(P.eyeH||1.68))*Math.min(1,dt*10);
    P.stairYs=(P.stairYs||0)+((P.stairY||0)-(P.stairYs||0))*Math.min(1,dt*12);
    const eyeY=P.eyeH+P.stairYs+Math.sin(bobT)*bobAmt*(P.crouch?.5:1);
    const sideBob=Math.cos(bobT*.5)*bobAmt*.6;
    camera.position.set(camTarget.x+Math.cos(yaw)*sideBob,eyeY,camTarget.z-Math.sin(yaw)*sideBob);
    if(shake>0){camera.position.x+=rand(-1,1)*shake;camera.position.y+=rand(-1,1)*shake;}
    const cp=Math.cos(pitch);
    camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camera.lookAt(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    player.visible=false;
    // 손에 든 손전등
    handLight.position.set(.3+Math.cos(bobT*.5)*bobAmt*.5,-.36+Math.abs(Math.sin(bobT))*bobAmt*.4,-.55);
    handLight.visible=state==='play';
    P.recoil=Math.max(0,P.recoil-dt*6);
    handGun.position.set(-.3-Math.cos(bobT*.5)*bobAmt*.5,-.3+Math.abs(Math.sin(bobT))*bobAmt*.4,-.52+P.recoil*.08);
    handGun.rotation.set(.05+P.recoil*.25,-.06,0);P.recoil=Math.max(0,P.recoil-dt*4);
    coilMat.color.setHex(P.shootCD>0||!P.ammo?0x1a3550:0x48b8ff);
    flashlight.position.set(camera.position.x+Math.cos(yaw)*.3,camera.position.y-.2,camera.position.z-Math.sin(yaw)*.3);
    flashlight.target.position.set(camera.position.x+camDir.x*10,camera.position.y+camDir.y*10-1,camera.position.z+camDir.z*10);
    // 불꽃 흔들림 (괴물이 가까우면 더 심하게)
    const mdist=Math.hypot(M.pos.x-P.pos.x,M.pos.z-P.pos.z),fear=M.state==='sleep'?0:clamp(1-(mdist-2)/9,0,1);
    lighterT+=dt;
    let fl=.85+.08*Math.sin(lighterT*11)+.06*Math.sin(lighterT*23.7)+rand(-.04,.04);
    if(fear>0&&Math.random()<fear*.25)fl*=rand(.35,.8);
    const lit=P.flashOn;
    if(P.torchOn){flashlight.color.setHex(0xfff2d8);flashlight.angle=.42;flashlight.distance=42;flashlight.penumbra=.5;flashlight.intensity=3.2*(P.torchBat<8&&Math.random()<.15?.3:1);}
    else{flashlight.color.setHex(0xff9a40);flashlight.angle=1.2;flashlight.distance=15;flashlight.penumbra=1;flashlight.intensity=lit?1.7*fl:0;}
    torchModel.visible=P.torchOn&&state==='play';handGun.visible=P.gun>0&&state==='play';
    aura.position.set(camera.position.x+Math.cos(yaw)*.35-Math.sin(yaw)*.5,camera.position.y-.1,camera.position.z-Math.sin(yaw)*.35-Math.cos(yaw)*.5);
    aura.intensity=lit?1.0*fl:.22;aura.distance=lit?9.5:5;aura.color.setHex(lit?0xff8a30:0x4a5a80);
    flame.visible=lit;flame.scale.set(1,fl*(1+fear*Math.random()*.5),1);flame.rotation.z=Math.sin(lighterT*7)*.12+P.vel.x*0;
    flameGlow.material.opacity=lit?fl:0;
  }
  if(shake>0)shake=Math.max(0,shake-dt*(state==='caught'?.05:1.2));
  renderer.render(scene,camera);
}

// 메뉴 배경
buildWorld();P.pos.copy(startPos);monsters.forEach((x,k)=>{x.M.pos.copy(monsterSpawns[k]||monsterSpawn);x.group.position.copy(x.M.pos);x.group.position.y=-.3;});parkMon(monsters[2]);monsters.slice(3).forEach(parkMon);
player.position.copy(P.pos);camTarget.set(P.pos.x,1.75,P.pos.z);
showMenu();loop();
})();
</script>
