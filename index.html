<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>

#slits{display:none;z-index:1;background:repeating-linear-gradient(180deg,#050302 0 34px,rgba(0,0,0,0) 34px 46px)}
#flash{background:#b00000;opacity:0;z-index:6}
#hud{position:fixed;top:12px;left:12px;z-index:2;display:none;flex-direction:column;gap:7px;pointer-events:none;text-shadow:0 2px 3px #000}
.row{display:flex;align-items:center;gap:8px;font-size:18px}
.bar{width:130px;height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden}
.bar>div{height:100%;width:100%;border-radius:6px}
#fuseTxt{font-size:24px;color:#ffd257}
#prompt{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);font-size:22px;background:rgba(0,0,0,.55);padding:8px 16px;border-radius:10px;display:none;z-index:2;pointer-events:none;white-space:nowrap}
#msg{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);font-size:30px;text-align:center;text-shadow:0 0 12px #000,0 2px 2px #000;opacity:0;transition:opacity .4s;z-index:3;pointer-events:none;white-space:nowrap}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:7}
.card{background:#121418;border:1px solid #2a2e36;border-radius:18px;padding:26px 24px 20px;max-width:390px;width:calc(100% - 44px);text-align:center;box-shadow:0 0 40px rgba(160,0,0,.25)}
.card h1{margin:0 0 6px;font-size:36px;font-weight:400;color:#e8e8e8;letter-spacing:1px}
.card h1 b{color:#d42a2a;font-weight:400}
.card .sub{margin:0 0 14px;color:#9aa0ab;font-size:16px;line-height:1.5}
.card ul{list-style:none;padding:0;margin:0 0 18px;text-align:left;font-size:14.5px;line-height:1.6;color:#c5cad3;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}

button.go{font-family:inherit;font-size:23px;color:#fff;background:#a51d1d;border:none;border-radius:12px;padding:12px 38px;box-shadow:0 4px 0 #5e0e0e;cursor:pointer}

.keys{font-size:12.5px;color:#6f7580;margin-top:12px;font-family:system-ui,sans-serif;line-height:1.5}
#joy{position:fixed;left:22px;bottom:26px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);display:none;z-index:4;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.45);transform:translate(-50%,-50%);pointer-events:none}
.tbtn{position:fixed;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(20,20,25,.6);color:#fff;font-family:inherit;font-size:16px;display:none;z-index:4;touch-action:none}
#bRun{right:24px;bottom:30px;width:88px;height:88px;background:rgba(120,25,25,.7)}
#bHide{right:122px;bottom:40px}
#bLight{right:40px;bottom:132px}
#bShoot{right:128px;bottom:138px;width:86px;height:86px;background:rgba(30,90,170,.75)}
#fsBtn{position:fixed;top:12px;right:62px;z-index:8;font-size:18px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:7px 10px;cursor:pointer;font-family:inherit}
#musBtn{position:fixed;top:12px;right:12px;z-index:4;font-size:20px;background:rgba(0,0,0,.45);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:6px 10px;cursor:pointer;display:none}
#stunTxt{color:#7fc4ff;display:none}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 4px #000;z-index:2;pointer-events:none;display:none}
#err{display:none;position:fixed;inset:0;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="fx" id="vig"></div>

  <div class="row" id="fuseTxt">⚡ 퓨즈 0 / 5</div>

<div id="err">3D 그래픽을 불러오지 못했어요. 새로고침하거나 다른 브라우저로 열어 주세요.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const $=id=>document.getElementById(id);
const PI=Math.PI,V3=THREE.Vector3;
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ================= 설정 =================
const N=9,G=2*N+1,T=4,H=4.6;
const PR=0.45,WALK=4.6,RUN=7.6;
const NEED=5;
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];

// ================= 렌더러 =================
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){$('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x030405);
scene.fog=new THREE.FogExp2(0x030405,0.06);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,0.05,200);
scene.add(camera);
const handLight=new THREE.Group();camera.add(handLight);
const handGun=new THREE.Group();camera.add(handGun);
const coilMat=new THREE.MeshBasicMaterial({color:0x48b8ff});
(function(){const dark=new THREE.MeshBasicMaterial({color:0x22252b}),mid=new THREE.MeshBasicMaterial({color:0x3a3f48});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.075,.1,.32),mid);handGun.add(body);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.022,.026,.18,10),dark);barrel.rotation.x=PI/2;barrel.position.set(0,.015,-.24);handGun.add(barrel);
  [0,1,2].forEach(k=>{const c=new THREE.Mesh(new THREE.TorusGeometry(.036,.009,6,14),coilMat);c.position.set(0,.015,-.17-k*.04);handGun.add(c);});
  const grip=new THREE.Mesh(new THREE.BoxGeometry(.06,.14,.07),dark);grip.position.set(0,-.1,.08);grip.rotation.x=-.25;handGun.add(grip);
  const hand=new THREE.Mesh(new THREE.BoxGeometry(.085,.075,.11),new THREE.MeshBasicMaterial({color:0x6b4a3a}));hand.position.set(0,-.1,.09);handGun.add(hand);
  handGun.visible=false;})();
const muzzle=new THREE.Sprite(new THREE.SpriteMaterial({map:null,color:0x7fd0ff,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false,opacity:0}));
muzzle.scale.set(.25,.25,1);muzzle.position.set(0,.015,-.36);handGun.add(muzzle);
const lensMat=new THREE.MeshBasicMaterial({color:0xffb347});
const flame=new THREE.Group();
const flameGlow=new THREE.Sprite(new THREE.SpriteMaterial({color:0xff9a30,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));
(function(){const metal=new THREE.MeshBasicMaterial({color:0x8a8f98}),red=new THREE.MeshBasicMaterial({color:0x8a1d1d});
  const body=new THREE.Mesh(new THREE.BoxGeometry(.05,.1,.03),red);handLight.add(body);
  const cap=new THREE.Mesh(new THREE.BoxGeometry(.052,.03,.032),metal);cap.position.y=.065;handLight.add(cap);
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.02,10),metal);wheel.rotation.z=PI/2;wheel.position.set(0,.085,.008);handLight.add(wheel);
  const core=new THREE.Mesh(new THREE.ConeGeometry(.013,.05,8),new THREE.MeshBasicMaterial({color:0xfff2b0}));core.position.y=.025;flame.add(core);
  const outer=new THREE.Mesh(new THREE.ConeGeometry(.022,.075,8),new THREE.MeshBasicMaterial({color:0xff8a20,transparent:true,opacity:.8}));outer.position.y=.035;flame.add(outer);
  flameGlow.scale.set(.22,.22,1);flameGlow.position.y=.03;flame.add(flameGlow);
  flame.position.y=.1;handLight.add(flame);
  const hand=new THREE.Mesh(new THREE.BoxGeometry(.08,.08,.1),new THREE.MeshBasicMaterial({color:0x6b4a3a}));hand.position.set(0,-.05,.03);handLight.add(hand);
  handLight.rotation.set(0,-.15,0);handLight.visible=false;})();

scene.add(new THREE.AmbientLight(0x2a3550,0.32));
scene.add(new THREE.HemisphereLight(0x223047,0x0a0806,0.25));

const flashlight=new THREE.SpotLight(0xff9a40,1.7,15,1.2,1,1.5);
flashlight.castShadow=true;flashlight.shadow.mapSize.set(1024,1024);flashlight.shadow.camera.near=0.3;flashlight.shadow.bias=-0.0006;
scene.add(flashlight);scene.add(flashlight.target);
const aura=new THREE.PointLight(0xff8a30,0.9,9,1.6);scene.add(aura);
const candleLights=[];for(let k=0;k<6;k++){const l=new THREE.PointLight(0xff9a40,0,6.5,2);scene.add(l);candleLights.push(l);}

// ================= 텍스처 =================
function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);}return t;}
const floorTex=canvasTex(256,256,(g,w,h)=>{
  for(let r=0;r<8;r++){const y=r*32;g.fillStyle=`hsl(25,${30+Math.random()*10}%,${11+Math.random()*5}%)`;g.fillRect(0,y,w,32);
    const off=Math.random()*256;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,y,w,2);g.fillRect(off,y,2,32);g.fillRect((off+128)%256,y,2,32);}
  for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.25})`;g.fillRect(Math.random()*w,Math.random()*h,2,1);}
},(G*T)/4);
const wallTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle='#3a4238';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=32){g.fillStyle='rgba(255,255,255,.04)';g.fillRect(x,0,14,h);g.fillStyle='rgba(120,140,90,.06)';for(let y=8;y<h;y+=24)g.fillRect(x+20,y,6,6);}
  const gr=g.createLinearGradient(0,h*.55,0,h);gr.addColorStop(0,'rgba(30,18,8,0)');gr.addColorStop(1,'rgba(30,18,8,.85)');g.fillStyle=gr;g.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){g.fillStyle=`rgba(20,10,0,${rand(.05,.18)})`;g.beginPath();g.arc(Math.random()*w,Math.random()*h,rand(6,30),0,7);g.fill();}
  g.fillStyle='#241a12';g.fillRect(0,h-22,w,22);g.fillStyle='#16100b';g.fillRect(0,0,w,6);
});
const glowTex=canvasTex(64,64,(g)=>{const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.35,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);});
flameGlow.material.map=glowTex;flameGlow.material.needsUpdate=true;
const exitTex=canvasTex(256,96,(g,w,h)=>{g.fillStyle='#062b10';g.fillRect(0,0,w,h);g.strokeStyle='#38ff6a';g.lineWidth=6;g.strokeRect(6,6,w-12,h-12);g.fillStyle='#5dff85';g.font='bold 58px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('EXIT',w/2,h/2+3);});

const floorMat=new THREE.MeshPhongMaterial({map:floorTex,shininess:8});
const wallMat=new THREE.MeshPhongMaterial({map:wallTex,shininess:4});
const ceilMat=new THREE.MeshPhongMaterial({color:0x15171a,shininess:0});
const wallGeo=new THREE.BoxGeometry(T,H,T);wallGeo.userData.shared=true;
function phong(color,o){return new THREE.MeshPhongMaterial(Object.assign({color,shininess:30},o||{}));}
function mesh(geo,mat,shadow){const m=new THREE.Mesh(geo,mat);if(shadow!==false){m.castShadow=true;m.receiveShadow=true;}return m;}
function glow(color,size){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color,blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false}));s.scale.set(size,size,1);return s;}

// ================= 몽글이 (플레이어) =================
const player=new THREE.Group();scene.add(player);
const pl={};
(function(){
  const blue=phong(0x3b7bff,{shininess:60}),light=phong(0x9cc2ff,{shininess:40}),white=phong(0xffffff,{shininess:90}),black=phong(0x0c0c12,{shininess:120}),dark=phong(0x2a5fd6);
  const body=mesh(new THREE.SphereGeometry(0.75,28,20),blue);body.scale.set(1,1.12,.95);body.position.y=1.2;player.add(body);
  const belly=mesh(new THREE.SphereGeometry(0.5,20,14),light);belly.scale.set(1,1.05,.45);belly.position.set(0,1.05,.5);player.add(belly);
  [-1,1].forEach(s=>{
    const eye=mesh(new THREE.SphereGeometry(0.21,18,14),white);eye.position.set(s*.25,1.62,.6);eye.scale.z=.7;player.add(eye);
    const pu=mesh(new THREE.SphereGeometry(0.1,14,10),black);pu.position.set(s*.24,1.6,.74);player.add(pu);
    const shine=mesh(new THREE.SphereGeometry(0.035,8,6),white,false);shine.position.set(s*.24+.04,1.65,.83);player.add(shine);
  });
  const tuft=mesh(new THREE.ConeGeometry(.16,.4,12),dark);tuft.position.set(0,2.08,0);tuft.rotation.z=.3;player.add(tuft);
  const tuft2=mesh(new THREE.ConeGeometry(.11,.28,10),dark);tuft2.position.set(.14,2.02,-.05);tuft2.rotation.z=-.5;player.add(tuft2);
  const limb=(x,y,sx,sy,parentY)=>{const p=new THREE.Group();p.position.set(x,parentY,0);const m=mesh(new THREE.SphereGeometry(1,14,10),blue);m.scale.set(sx,sy,sx);m.position.y=y-parentY;p.add(m);player.add(p);return p;};
  pl.armL=limb(-.78,1.05,.2,.38,1.35);pl.armR=limb(.78,1.05,.2,.38,1.35);
  pl.legL=limb(-.32,.3,.27,.32,.55);pl.legR=limb(.32,.3,.27,.32,.55);
})();

// ================= 괴물 =================
const monster=new THREE.Group();scene.add(monster);
const mo={};
(function(){
  const skin=phong(0x1b1b20,{shininess:70,specular:0x333333}),skin2=phong(0x111114,{shininess:20});
  const torso=mesh(new THREE.BoxGeometry(1.05,1.9,.6),skin);torso.position.y=2.75;monster.add(torso);
  const rib=mesh(new THREE.BoxGeometry(.85,.08,.62),skin2);[2.4,2.6,2.8].forEach(y=>{const r=rib.clone();r.position.y=y;monster.add(r);});
  mo.head=new THREE.Group();mo.head.position.y=3.95;monster.add(mo.head);
  const head=mesh(new THREE.BoxGeometry(.95,1.05,.85),skin);head.position.y=.25;mo.head.add(head);
  const eyeMat=new THREE.MeshBasicMaterial({color:0xff1a1a,fog:false});
  [-1,1].forEach(s=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.2,.11,.04),eyeMat);e.position.set(s*.22,.42,.44);e.rotation.z=-s*.25;mo.head.add(e);
    const gl=glow(0xff2020,.9);gl.position.set(s*.22,.42,.5);mo.head.add(gl);});
  const mouth=new THREE.Mesh(new THREE.BoxGeometry(.7,.3,.04),new THREE.MeshBasicMaterial({color:0x250000}));mouth.position.set(0,-.02,.44);mo.head.add(mouth);
  const tooth=new THREE.MeshBasicMaterial({color:0xd8d2c0});
  for(let k=0;k<6;k++){const t=new THREE.Mesh(new THREE.ConeGeometry(.04,.13,4),tooth);t.position.set(-.27+k*.108,.08,.47);t.rotation.x=PI;mo.head.add(t);
    const b=new THREE.Mesh(new THREE.ConeGeometry(.04,.11,4),tooth);b.position.set(-.22+k*.09,-.12,.47);mo.head.add(b);}
  const eyeLight=new THREE.PointLight(0xff2020,1.1,7,2);eyeLight.position.set(0,.4,.9);mo.head.add(eyeLight);
  mo.eyeMat=eyeMat;mo.eyeLight=eyeLight;
  const limb=(x,py,w,len,mat)=>{const p=new THREE.Group();p.position.set(x,py,0);const m=mesh(new THREE.BoxGeometry(w,len,w),mat);m.position.y=-len/2;p.add(m);
    const claw=mesh(new THREE.BoxGeometry(w*1.3,.35,w*1.6),skin2);claw.position.y=-len-.1;p.add(claw);monster.add(p);return p;};
  mo.armL=limb(-.72,3.55,.24,2.5,skin);mo.armR=limb(.72,3.55,.24,2.5,skin);
  mo.legL=limb(-.3,1.8,.32,1.7,skin2);mo.legR=limb(.3,1.8,.32,1.7,skin2);
})();

// ================= 월드 =================
let candles=[],candleTimer=0,world=null,grid,gate={},closets=[],items=[],lamps=[],startPos=new V3(),monsterSpawn=new V3(),exitLight=null,exitGlow=null;
function tc(i){return i*T+T/2;}
function tileOf(x){return Math.floor(x/T);}
function genMaze(){
  grid=Array.from({length:G},()=>Array(G).fill(1));
  const vis=new Set(['0,0']),stack=[[0,0]];grid[1][1]=0;
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const nb=DIRS.map(([dx,dy])=>[cx+dx,cy+dy,dx,dy]).filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N&&!vis.has(x+','+y));
    if(!nb.length){stack.pop();continue;}
    const [nx,ny,dx,dy]=pick(nb);grid[2*cx+1+dx][2*cy+1+dy]=0;grid[2*nx+1][2*ny+1]=0;vis.add(nx+','+ny);stack.push([nx,ny]);
  }
  for(let k=0;k<N*N*.2;k++){const i=1+Math.floor(Math.random()*(G-2)),j=1+Math.floor(Math.random()*(G-2));if(grid[i][j]===1&&((i%2)+(j%2))===1)grid[i][j]=0;}
  for(let k=0;k<3;k++){const i=1+2*Math.floor(Math.random()*(N-1)),j=1+2*Math.floor(Math.random()*(N-1));for(let a=i;a<=i+2;a++)for(let b=j;b<=j+2;b++)grid[a][b]=0;}
}
function bfsDist(si,sj){const d=new Int32Array(G*G).fill(-1);const q=[si*G+sj];d[si*G+sj]=0;let h=0;
  while(h<q.length){const c=q[h++],ci=(c/G)|0,cj=c%G;for(const [dx,dz] of DIRS){const ni=ci+dx,nj=cj+dz;if(ni<0||nj<0||ni>=G||nj>=G||grid[ni][nj]!==0)continue;const n=ni*G+nj;if(d[n]!==-1)continue;d[n]=d[c]+1;q.push(n);}}return d;}
function bfsPath(si,sj,ti,tj){
  if(ti<0||tj<0||ti>=G||tj>=G||grid[ti][tj]!==0)return null;
  if(si===ti&&sj===tj)return[];
  const prev=new Int32Array(G*G).fill(-1),s=si*G+sj,t=ti*G+tj;prev[s]=s;const q=[s];let h=0;
  while(h<q.length){const c=q[h++];if(c===t)break;const ci=(c/G)|0,cj=c%G;
    for(const [dx,dz] of DIRS){const ni=ci+dx,nj=cj+dz;if(ni<0||nj<0||ni>=G||nj>=G||grid[ni][nj]!==0)continue;const n=ni*G+nj;if(prev[n]!==-1)continue;prev[n]=c;q.push(n);}}
  if(prev[t]===-1)return null;
  const path=[];let c=t;while(c!==s){path.push([(c/G)|0,c%G]);c=prev[c];}return path.reverse();
}

  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(musBus);o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);}catch(e){}}
function scheduleMusic(){
  if(!AC||!musBus||!musicOn||(state!=='play'))return;
  const now=AC.currentTime;if(musNext<now)musNext=now+.05;
  const chase=M.state==='chase'||M.state==='closet';
  while(musNext<now+.25){
    const t=musNext,bar=Math.floor(musStep/8)%4,pos=musStep%8,ch=CH[bar];
    if(pos===0){ch.forEach(n=>mnote(mtof(n-12),t,BEAT*8.5,'triangle',.05,700));mnote(mtof(ch[0]-24),t,BEAT*8.5,'sine',.08);}
    const pat=[0,2,1,2,0,3,1,2];
    if(Math.random()<(chase?.95:.8)){const p=pat[pos],n=p===3?ch[0]+24:ch[p]+12;pluck(mtof(n+(Math.random()<.06?1:0)),t,.07);}
    if(chase){if(pos%2===0){mnote(55,t,.25,'sine',.22);noise(.06,.05,180,1,t-now);}if(pos===4)mnote(mtof(ch[0]+1),t,BEAT*3,'sawtooth',.03,1200);}
    musNext+=chase?BEAT*.75:BEAT;musStep++;
  }
}

// ================= 충돌 =================
function pushAABB(p,r,x0,z0,x1,z1){
  const cx=clamp(p.x,x0,x1),cz=clamp(p.z,z0,z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
  if(d2>=r*r)return;
  if(d2>1e-9){const d=Math.sqrt(d2);p.x=cx+dx/d*r;p.z=cz+dz/d*r;}
  else{const a=p.x-x0,b=x1-p.x,c=p.z-z0,e=z1-p.z,m=Math.min(a,b,c,e);if(m===a)p.x=x0-r;else if(m===b)p.x=x1+r;else if(m===c)p.z=z0-r;else p.z=z1+r;}
}
function collide(p,r){
  const ci=tileOf(p.x),cj=tileOf(p.z);
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++)if(solid(i,j))pushAABB(p,r,i*T,j*T,i*T+T,j*T+T);
  for(const c of closets)pushAABB(p,r,c.minX,c.minZ,c.maxX,c.maxZ);
}
function interactTarget(){
  const cl=nearCloset(),cd=nearCandle();
  let dc=99;if(cl)dc=Math.hypot(P.pos.x-(cl.x+cl.fx*cl.S.out),P.pos.z-(cl.z+cl.fz*cl.S.out));
  if(cd&&cd.d<dc)return{type:'candle',c:cd.c};
  if(cl)return{type:'hide',c:cl};return null;
}
function nearCloset(){let best=null,bd=1.9;for(const c of closets){const fx=c.x+c.fx*c.S.out,fz=c.z+c.fz*c.S.out,d=Math.hypot(P.pos.x-fx,P.pos.z-fz);if(d<bd){bd=d;best=c;}}return best;}

function updatePlayer(dt){
  if(lightReq){lightReq=false;if(!hidden){P.flashOn=!P.flashOn;sfx.click();}}
  if(hideReq){hideReq=false;if(hidden)unhide();else{const it=interactTarget();if(it&&it.type==='candle')lightCandle(it.c);else if(it)hide(it.c);}}
  P.shootCD=Math.max(0,P.shootCD-dt);
  if(shootReq){shootReq=false;if(!hidden)shoot();}
  if(hidden){P.stamina=Math.min(100,P.stamina+dt*20);return;}
  let fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy;
  let str=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx;
  const il=Math.hypot(fwd,str);if(il>1){fwd/=il;str/=il;}
  P.moving=il>.15;
  const wantRun=(keys.ShiftLeft||keys.ShiftRight||runBtn)&&P.moving;
  if(wantRun&&(P.running?P.stamina>0:P.stamina>15))P.running=true;else P.running=false;
  if(P.running){P.stamina=Math.max(0,P.stamina-dt*22);P.staDelay=1;}
  else{P.staDelay-=dt;if(P.staDelay<=0)P.stamina=Math.min(100,P.stamina+dt*14);}
  const sp=P.running?RUN:WALK;
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=-fz,rz=fx;
  const mx=(fx*fwd+rx*str)*sp,mz=(fz*fwd+rz*str)*sp;
  P.vel.x+=(mx-P.vel.x)*Math.min(1,dt*12);P.vel.z+=(mz-P.vel.z)*Math.min(1,dt*12);
  P.pos.x+=P.vel.x*dt;P.pos.z+=P.vel.z*dt;
  collide(P.pos,PR);
  const spd=Math.hypot(P.vel.x,P.vel.z);
  if(spd>.5){P.stepT-=dt*spd;if(P.stepT<=0){P.stepT=2.2;sfx.pstep();}}
  // 배터리
  
  // 아이템
  for(let k=items.length-1;k>=0;k--){const it=items[k];if(Math.hypot(P.pos.x-it.g.position.x,P.pos.z-it.g.position.z)<1.15){
      world.remove(it.g);items.splice(k,1);sfx.pick();
      if(it.type==='fuse'){fuses++;if(fuses>=NEED)openGate();else msg('⚡ 퓨즈 '+fuses+' / '+NEED,1.6);}
      else if(it.type==='ammo'){P.ammo=Math.min(6,P.ammo+2);msg('🔫 충격탄 +2',1.4);}
      else{P.battery=Math.min(100,P.battery+45);msg('🔥 라이터 기름 보충',1.4);}}}
  // 탈출
  if(gate.open&&tileOf(P.pos.x)===gate.i&&tileOf(P.pos.z)===gate.j){win();}
  // 모습
  player.position.copy(P.pos);
  let d=(yaw+PI)-player.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));player.rotation.y+=d*Math.min(1,dt*12);
  animT+=dt*(4+spd*1.6);
  const sw=Math.sin(animT)*Math.min(1,spd/WALK)*.7;
  pl.legL.rotation.x=sw;pl.legR.rotation.x=-sw;pl.armL.rotation.x=-sw*.8;pl.armR.rotation.x=sw*.8;
  player.children[0].position.y=1.2+Math.abs(Math.sin(animT))*.06*Math.min(1,spd/WALK);
}
let tracers=[];
function shoot(){
  return; // 전기총 제거됨
  if(P.shootCD>0)return;
  if(P.ammo<=0){osc(220,.08,'square',.05);msg('충격탄이 없다!',1);P.shootCD=.3;return;}
  P.ammo--;P.shootCD=.7;P.recoil=1;
  osc(1500,.28,'sawtooth',.13,-1100);noise(.22,.22,3200,1);
  muzzle.material.opacity=1;
  const o=camera.position.clone(),d=camDir.clone().normalize();
  let hit=false,end=o.clone().addScaledVector(d,40);
  for(let t=.3;t<40;t+=.08){
    const x=o.x+d.x*t,y=o.y+d.y*t,z=o.z+d.z*t;
    if(solid(tileOf(x),tileOf(z))||y<0||y>H){end.set(x,y,z);break;}
    if(M.state!=='sleep'&&Math.hypot(x-M.pos.x,z-M.pos.z)<.75&&y>0&&y<4.8){hit=true;end.set(x,y,z);break;}
  }
  // 궤적
  const tip=new V3();muzzle.getWorldPosition(tip);
  const geo=new THREE.BufferGeometry().setFromPoints([tip,end]);
  const ln=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0x8fd4ff,transparent:true,opacity:1,fog:false}));
  scene.add(ln);tracers.push({ln,t:.18});
  const sp=glow(0x6ac8ff,hit?2.2:.9);sp.position.copy(end);scene.add(sp);tracers.push({ln:sp,t:.25});
  if(hit)stunMonster();
}

function openGate(){
  gate.open=true;sfx.gate();shake=.35;exitLight.intensity=2.2;
  msg('🚪 출구 전원이 켜졌다!<br><span style="font-size:20px">초록 불빛을 따라 탈출해!</span>',3.5);
  if(M.state!=='closet'){M.state='chase';M.lastSeen.copy(P.pos);M.lostT=-4;sfx.screech();}
}
function win(){state='win';$('cross').style.display='none';sfx.win();$('hud').style.display='none';prompt.style.display='none';try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}setTimeout(()=>showEnd(true),400);}

// ================= 괴물 AI =================
function mSpeed(){return(M.state==='chase'||M.state==='closet')?(5.0+fuses*.22+(gate.open?.5:0)):(2.5+fuses*.15);}
function mMoveTo(x,z,sp,dt){const dx=x-M.pos.x,dz=z-M.pos.z,d=Math.hypot(dx,dz);if(d<1e-4)return d;const s=Math.min(d,sp*dt);M.pos.x+=dx/d*s;M.pos.z+=dz/d*s;
  let a=Math.atan2(dx,dz)-M.face;a=Math.atan2(Math.sin(a),Math.cos(a));M.face+=a*Math.min(1,dt*8);return d;}
function mFollow(sp,dt){if(!M.path||!M.path.length)return false;const [i,j]=M.path[0];if(mMoveTo(tc(i),tc(j),sp,dt)<.3)M.path.shift();return true;}
function startChase(){if(M.state!=='chase'){sfx.screech();msg('<span style="color:#ff4040">그것이 당신을 봤다!</span>',1.6);shake=.25;}M.state='chase';M.lostT=0;M.repath=0;}
function updateMonster(dt){
  const dx=P.pos.x-M.pos.x,dz=P.pos.z-M.pos.z,dist=Math.hypot(dx,dz);
  if(M.state==='stun'){
    M.stunT-=dt;
    monster.rotation.z=Math.sin(playT*55)*.025*(Math.random()<.5?1:-1);
    mo.head.rotation.x+=(.75-mo.head.rotation.x)*Math.min(1,dt*4);
    mo.armL.rotation.x+=(0-mo.armL.rotation.x)*Math.min(1,dt*3);mo.armR.rotation.x+=(0-mo.armR.rotation.x)*Math.min(1,dt*3);
    mo.eyeLight.intensity=Math.random()<.3?0:.8;
    if(Math.random()<dt*3)noise(.12,.06*clamp(1-dist/20,0,1)+.005,2800,3);
    if(M.stunT<=0){
      M.state='search';M.searchT=2;M.path=[];monster.rotation.z=0;mo.eyeLight.intensity=1.1;
      mo.eyeMat.color.setHex(0xff1a1a);mo.eyeLight.color.setHex(0xff2020);
      msg('<span style="color:#ff4040">괴물이 다시 움직인다!</span>',1.8);osc(90,.8,'sawtooth',.1,40);
    }
    monster.position.set(M.pos.x,0,M.pos.z);
    return dist;
  }
  let sees=false,heard=false;
  if(!hidden&&state==='play'&&M.state!=='sleep'){
    const range=P.flashOn?20:10;
    if(dist<range&&los(M.pos.x,M.pos.z,P.pos.x,P.pos.z)){
      const cosA=(Math.sin(M.face)*dx+Math.cos(M.face)*dz)/(dist||1);
      if(dist<5||cosA>.25||M.state==='chase')sees=true;
    }
    if(P.running&&dist<15)heard=true;
  }
  M.seenAgo=sees?0:M.seenAgo+dt;
  const mt=[tileOf(M.pos.x),tileOf(M.pos.z)];
  switch(M.state){
    case 'sleep':
      M.sleepT-=dt;if(M.sleepT<=0){M.state='wander';msg('어딘가에서 <span style="color:#ff4040">무언가</span>가 깨어났다…',2.6);sfx.screech();}
      break;
    case 'wander':
      if(sees||heard){startChase();M.lastSeen.copy(P.pos);break;}
      if(!mFollow(mSpeed(),dt)){
        // 가끔은 플레이어 근처로 배회
        let ti,tj;
        if(Math.random()<.35){ti=tileOf(P.pos.x)+Math.round(rand(-3,3))*2;tj=tileOf(P.pos.z)+Math.round(rand(-3,3))*2;}
        else{ti=1+2*Math.floor(Math.random()*N);tj=1+2*Math.floor(Math.random()*N);}
        ti=clamp(ti|1,1,G-2);tj=clamp(tj|1,1,G-2);
        M.path=bfsPath(mt[0],mt[1],ti,tj)||[];
      }
      break;
    case 'search':
      if(sees||heard){startChase();M.lastSeen.copy(P.pos);break;}
      if(!mFollow(mSpeed()*1.3,dt)){M.searchT-=dt;M.face+=dt*1.6;if(M.searchT<=0){M.state='wander';M.path=[];}}
      break;
    case 'chase':
      if(sees){M.lastSeen.copy(P.pos);M.lostT=Math.min(M.lostT,0);M.lostT=0;}
      else if(heard){M.lastSeen.copy(P.pos);}
      else M.lostT+=dt;
      if(M.lostT>5){M.state='search';M.searchT=3.5;M.path=bfsPath(mt[0],mt[1],tileOf(M.lastSeen.x),tileOf(M.lastSeen.z))||[];msg('…놓친 것 같다',1.6);break;}
      if(sees&&dist<6){mMoveTo(P.pos.x,P.pos.z,mSpeed(),dt);M.path=[];}
      else{M.repath-=dt;if(M.repath<=0||!M.path.length){M.repath=.3;M.path=bfsPath(mt[0],mt[1],tileOf(M.lastSeen.x),tileOf(M.lastSeen.z))||[];}
        if(!mFollow(mSpeed(),dt))mMoveTo(M.lastSeen.x,M.lastSeen.z,mSpeed(),dt);}
      break;
    case 'closet':{
      const c=M.closet,fx=c.x+c.fx*(c.S.out+.1),fz=c.z+c.fz*(c.S.out+.1);
      if(!mFollow(mSpeed(),dt)){const d=mMoveTo(fx,fz,mSpeed(),dt);if(d<.4){caught();}}
      break;}
  }
  if(state==='play'&&!hidden&&dist<1.25&&M.state!=='sleep')caught();
  // 모습
  monster.position.copy(M.pos);monster.rotation.y=M.face;
  const moving=M.state!=='sleep';
  const chasing=M.state==='chase'||M.state==='closet';
  M.anim+=dt*(moving?(chasing?9:4.5):0);
  const sw=Math.sin(M.anim)*(moving?.55:0);
  mo.legL.rotation.x=sw;mo.legR.rotation.x=-sw;
  const reach=chasing?-1.25:0;
  mo.armL.rotation.x+=((reach-sw*.6)-mo.armL.rotation.x)*Math.min(1,dt*6);
  mo.armR.rotation.x+=((reach+sw*.6)-mo.armR.rotation.x)*Math.min(1,dt*6);
  mo.armL.rotation.z=.08;mo.armR.rotation.z=-.08;
  M.twitch-=dt;if(M.twitch<=0){M.twitch=rand(.6,3);mo.head.rotation.z=rand(-.35,.35);mo.head.rotation.y=rand(-.3,.3);}
  mo.head.rotation.z*=Math.pow(.2,dt);
  if(M.state==='sleep'){monster.position.y=-.3;mo.head.rotation.x=.7;}else{mo.head.rotation.x=chasing?-.1:.15;monster.position.y=Math.abs(Math.sin(M.anim))*.08;}
  // 발소리
  if(moving&&state==='play'){M.stepT-=dt*(chasing?2:1);if(M.stepT<=0){M.stepT=.55;const v=clamp(1-dist/26,0,1);if(v>0)sfx.mstep(.03+v*.3);}}
  return dist;
}
function caught(){
  if(state!=='play')return;
  state='over';
  if(hidden){hidden=null;$('slits').style.display='none';}
  $('hud').style.display='none';prompt.style.display='none';$('red').style.opacity=0;
  osc(110,1.2,'sine',.25,-60);
  try{if(document.pointerLockElement)document.exitPointerLock();}catch(e){}
  $('cross').style.display='none';
  showEnd(false);
}

// ================= 메인 루프 =================
const clock=new THREE.Clock(),tmp=new V3(),camDir=new V3();
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clock.getDelta());
  let mDist=99;
  if(state==='play'){
    playT+=dt;
    updatePlayer(dt);
    mDist=updateMonster(dt);
    // 심장 박동
    const chase=M.state==='chase'||M.state==='closet';
    const close=clamp(1-mDist/(chase?30:20),0,1)*(M.state==='sleep'?.3:1);
    heartT-=dt;if(heartT<=0&&close>.05){heartT=1.15-close*.8;sfx.heart(.05+close*.32);}
    $('red').style.opacity=chase?(.25+close*.6).toFixed(2):(close*.35).toFixed(2);
    whisperT-=dt;if(whisperT<=0){whisperT=rand(14,30);if(Math.random()<.6)sfx.whisper();}
    // 안내
    const it=!hidden&&interactTarget();const c=it&&it.type==='hide'?it.c:null;
    const key=isTouch?'행동 버튼':'E';
    if(hidden){prompt.textContent=(isTouch?'행동 버튼':'E')+' — '+hidden.S.name+'에서 나가기';prompt.style.display='block';}
    else if(c){prompt.textContent=key+' — '+c.S.name+'에 숨기';prompt.style.display='block';}
    else if(it&&it.type==='candle'){prompt.textContent=key+' — 🕯️ 양초에 불 붙이기';prompt.style.display='block';}
    else prompt.style.display='none';
    updateHUD();
  }else if(state==='caught'){
    caughtT+=dt;
    $('flash').style.opacity=Math.max(0,.55-caughtT*.6).toFixed(2);
    if(caughtT>1.6&&overlay.style.display==='none'){showEnd(false);}
  }
  // 아이템, 전등
  for(const it of items){it.t+=dt;it.g.rotation.y+=dt*1.6;it.g.position.y=it.y+Math.sin(it.t*2.2)*.12;}
  if(candles.length)updateCandles(dt);
  for(const L of lamps){L.t+=dt;const f=Math.random()<.04?rand(0,.3):1;const v=L.base*(.75+.25*Math.sin(L.t*13)*Math.sin(L.t*3.1))*f;L.l.intensity=v;L.bulb.visible=f>.5;}
  if(exitGlow&&gate.open){gate.lift=Math.min(H-.3,gate.lift+dt*1.4);gate.mesh.position.y=gate.lift;exitGlow.material.opacity=.7+.3*Math.sin(playT*4);}
  if(msgT>0){msgT-=dt;if(msgT<=0)msgEl.style.opacity=0;}

  // 카메라
  if(state==='caught'||hidden||state==='over'){handLight.visible=false;handGun.visible=false;}
  muzzle.material.opacity=Math.max(0,muzzle.material.opacity-dt*14);
  for(let k=tracers.length-1;k>=0;k--){const tr=tracers[k];tr.t-=dt;tr.ln.material.opacity=Math.max(0,tr.t*5);if(tr.t<=0){scene.remove(tr.ln);if(tr.ln.geometry&&!tr.ln.isSprite)tr.ln.geometry.dispose();tracers.splice(k,1);}}
  scheduleMusic();
  scene.fog.density+=((hidden?.04:.06)-scene.fog.density)*Math.min(1,dt*4);
  if(state==='caught'){
    const hx=M.pos.x+Math.sin(M.face)*1.25,hz=M.pos.z+Math.cos(M.face)*1.25;
    camera.position.set(hx+rand(-1,1)*shake,4.05+rand(-1,1)*shake,hz+rand(-1,1)*shake);
    camera.lookAt(M.pos.x,4.15,M.pos.z);
    mo.head.rotation.z=Math.sin(caughtT*40)*.06;
    flashlight.position.copy(camera.position);flashlight.target.position.set(M.pos.x,4.1,M.pos.z);flashlight.intensity=2;
  }else if(hidden){
    const c=hidden;
    camera.position.set(c.x+c.fx*c.S.camF,c.S.camY+Math.sin(playT*1.3)*.01,c.z+c.fz*c.S.camF);
    const a=Math.atan2(c.fx,c.fz)+hideYaw+Math.sin(playT*.7)*.03;
    const ty=camera.position.y+(c.S.lookY-c.S.camY)-Math.tan(hidePitch)*6;
    camera.lookAt(camera.position.x+Math.sin(a)*6,ty,camera.position.z+Math.cos(a)*6);
    flashlight.intensity=0;
    // 틈새로 들어오는 희미한 빛
    aura.position.set(c.x+c.fx*(c.S.out+1.6),1.6,c.z+c.fz*(c.S.out+1.6));aura.intensity=.75;aura.distance=11;
  }else{
    if(state==='menu'){yaw+=dt*.08;}
    camTarget.lerp(tmp.set(P.pos.x,0,P.pos.z),1-Math.exp(-dt*20));
    const spdNow=Math.hypot(P.vel.x,P.vel.z);
    bobT+=dt*spdNow*1.9;const bobAmt=Math.min(1,spdNow/WALK)*(P.running?.075:.045);
    const eyeY=1.68+Math.sin(bobT)*bobAmt;
    const sideBob=Math.cos(bobT*.5)*bobAmt*.6;
    camera.position.set(camTarget.x+Math.cos(yaw)*sideBob,eyeY,camTarget.z-Math.sin(yaw)*sideBob);
    if(shake>0){camera.position.x+=rand(-1,1)*shake;camera.position.y+=rand(-1,1)*shake;}
    const cp=Math.cos(pitch);
    camDir.set(-Math.sin(yaw)*cp,-Math.sin(pitch),-Math.cos(yaw)*cp);
    camera.lookAt(camera.position.x+camDir.x,camera.position.y+camDir.y,camera.position.z+camDir.z);
    player.visible=false;
    // 손에 든 손전등
    handLight.position.set(.3+Math.cos(bobT*.5)*bobAmt*.5,-.36+Math.abs(Math.sin(bobT))*bobAmt*.4,-.55);
    handLight.visible=state==='play';
    P.recoil=Math.max(0,P.recoil-dt*6);
    handGun.position.set(.3-Math.cos(bobT*.5)*bobAmt*.5,-.3+Math.abs(Math.sin(bobT))*bobAmt*.4,-.52+P.recoil*.08);
    handGun.rotation.set(.05+P.recoil*.25,-.06,0);handGun.visible=false;
    coilMat.color.setHex(P.shootCD>0||!P.ammo?0x1a3550:0x48b8ff);
    flashlight.position.set(camera.position.x+Math.cos(yaw)*.3,camera.position.y-.2,camera.position.z-Math.sin(yaw)*.3);
    flashlight.target.position.set(camera.position.x+camDir.x*10,camera.position.y+camDir.y*10-1,camera.position.z+camDir.z*10);
    // 불꽃 흔들림 (괴물이 가까우면 더 심하게)
    const mdist=Math.hypot(M.pos.x-P.pos.x,M.pos.z-P.pos.z),fear=M.state==='sleep'?0:clamp(1-(mdist-2)/9,0,1);
    lighterT+=dt;
    let fl=.85+.08*Math.sin(lighterT*11)+.06*Math.sin(lighterT*23.7)+rand(-.04,.04);
    if(fear>0&&Math.random()<fear*.25)fl*=rand(.35,.8);
    const lit=P.flashOn;
    flashlight.intensity=lit?1.7*fl:0;
    aura.position.set(camera.position.x+Math.cos(yaw)*.35-Math.sin(yaw)*.5,camera.position.y-.1,camera.position.z-Math.sin(yaw)*.35-Math.cos(yaw)*.5);
    aura.intensity=lit?1.0*fl:.22;aura.distance=lit?9.5:5;aura.color.setHex(lit?0xff8a30:0x4a5a80);
    flame.visible=lit;flame.scale.set(1,fl*(1+fear*Math.random()*.5),1);flame.rotation.z=Math.sin(lighterT*7)*.12+P.vel.x*0;
    flameGlow.material.opacity=lit?fl:0;
  }
  if(shake>0)shake=Math.max(0,shake-dt*(state==='caught'?.05:1.2));
  renderer.render(scene,camera);
}

// 메뉴 배경
buildWorld();P.pos.copy(startPos);M.pos.copy(monsterSpawn);monster.position.copy(M.pos);monster.position.y=-.3;
player.position.copy(P.pos);camTarget.set(P.pos.x,1.75,P.pos.z);
showMenu();loop();
})();
</script>
